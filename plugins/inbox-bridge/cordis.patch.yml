- insert:
    - id: inbox-bridge
      name: dsh-inbox-bridge
      config:
        label: 外部收件箱
        cwd: C:/Users/NUC/Desktop/noema
        intervalMs: 120000
        timeoutMs: 45000
        maxEvents: 6
        poll:
          command: node
          args:
            - scripts/inbox-bridge.mjs
            - poll
        ack:
          command: node
          args:
            - scripts/inbox-bridge.mjs
            - ack
