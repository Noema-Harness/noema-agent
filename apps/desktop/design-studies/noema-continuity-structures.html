<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Noema · 三种空间组织</title>
    <style>
      :root {
        font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
        color: #20282d;
        background: #e9ecee;
        font-size: 14px;
        font-synthesis: none;
        --ink: #20282d;
        --muted: #68727b;
        --line: #e3e7e9;
        --accent: #28556a;
        --soft: #eef3f5;
        --paper: #fcfcfc;
      }
      * {
        box-sizing: border-box;
      }
      :where(html, .index, .chat-scroll, .work-content, .session-scroll, .dialog-body, textarea) {
        scrollbar-gutter: stable;
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: transparent transparent;
        }
        html.scroll-active,
        :where(.index, .chat-scroll, .work-content, .session-scroll, .dialog-body, textarea):is(
          :hover,
          :focus-within,
          .scroll-active
        ) {
          scrollbar-color: #a5b0b8 transparent;
        }
      }
      @supports selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: auto;
          scrollbar-color: auto;
        }
        ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
        }
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
          background: transparent;
        }
        ::-webkit-scrollbar-button {
          display: none;
          width: 0;
          height: 0;
        }
        ::-webkit-scrollbar-thumb {
          background: transparent;
          border: 2px solid transparent;
          border-radius: 8px;
          background-clip: padding-box;
        }
        html.scroll-active::-webkit-scrollbar-thumb,
        :where(.index, .chat-scroll, .work-content, .session-scroll, .dialog-body, textarea):is(
            :hover,
            :focus-within,
            .scroll-active
          )::-webkit-scrollbar-thumb {
          background-color: #a5b0b8;
        }
        ::-webkit-scrollbar-thumb:hover {
          background-color: #77858f;
        }
      }
      @media (forced-colors: active) {
        * {
          scrollbar-color: auto;
        }
        ::-webkit-scrollbar-thumb {
          background-color: ButtonText;
        }
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        color: #869098;
      }
      button,
      a,
      input,
      textarea {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #27779c;
      }
      button {
        background: transparent;
        border: 0;
      }
      svg {
        width: 19px;
        height: 19px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      p {
        margin: 0 0 12px;
      }
      p:last-child {
        margin: 0;
      }
      .study-head {
        height: 58px;
        padding: 0 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: #f6f7f8;
        border-bottom: 1px solid #d9dfe3;
      }
      .study-head strong {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.4px;
      }
      .study-head span {
        font-size: 12px;
        color: #5f6b74;
        margin-left: 13px;
      }
      .study-head .study-meta {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .study-meta button {
        font-size: 12px;
        padding: 7px 10px;
        border: 1px solid #d5dce0;
        border-radius: 4px;
      }
      .study-controls {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 24px;
        align-items: center;
        background: #f6f7f8;
      }
      .variants,
      .scenes {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .variants button {
        padding: 9px 14px;
        font-size: 13px;
        border: 1px solid transparent;
        border-radius: 4px;
      }
      .variants button[aria-pressed="true"] {
        background: #263c47;
        color: white;
        border-color: #263c47;
      }
      .variants small {
        opacity: 0.7;
        margin-left: 6px;
      }
      .scenes button {
        font-size: 12px;
        color: #5b6670;
        padding: 7px 10px;
        border-bottom: 2px solid transparent;
      }
      .scenes button[aria-pressed="true"] {
        color: #1f4e62;
        border-bottom-color: #28556a;
      }
      .stage {
        padding: 7px 18px 0;
      }
      .app {
        container-type: inline-size;
        margin: auto;
        width: 100%;
        height: calc(100dvh - 180px);
        min-height: 470px;
        background: var(--paper);
        border: 1px solid #cdd5db;
        border-radius: 7px;
        box-shadow: 0 8px 28px #2336420a;
        overflow: hidden;
        transition: width 0.18s;
      }
      .stage.narrow .app {
        width: min(420px, 100%);
      }
      .window-head {
        height: 38px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 17px;
        background: #f6f7f8;
      }
      .wordmark {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .logo {
        display: inline-flex;
        width: 20px;
        height: 20px;
        align-items: center;
        justify-content: center;
      }
      .logo svg {
        width: 20px;
        height: 20px;
        stroke-width: 1.5;
      }
      .window-tools {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .window-tools button {
        font-size: 12px;
        padding: 3px 5px;
        color: #64717a;
      }
      .window-controls {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-left: 12px;
      }
      .window-tools .window-control {
        width: 32px;
        height: 30px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .window-control svg {
        width: 12px;
        height: 12px;
        stroke-width: 1.4;
        stroke-linecap: square;
      }
      .shell {
        position: relative;
        height: calc(100% - 38px);
        display: flex;
        min-width: 0;
        overflow: hidden;
      }
      .index {
        flex: 0 0 var(--index-width, 232px);
        min-width: 0;
        border-right: 1px solid var(--line);
        background: #f7f8f9;
        padding: 20px 10px 12px;
        display: none;
        overflow: auto;
      }
      .index .section-title {
        font-size: 11px;
        color: #727d85;
        margin: 23px 10px 8px;
        display: flex;
        justify-content: space-between;
      }
      .index .section-title:first-child {
        margin-top: 0;
      }
      .index .index-item {
        width: 100%;
        display: flex;
        gap: 10px;
        align-items: center;
        text-align: left;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 3px;
      }
      .index .index-item:hover {
        background: #edf0f2;
      }
      .index .index-item.selected {
        background: #e7edef;
        color: #1f4658;
      }
      .index-item .item-title {
        font-weight: 550;
        font-size: 13px;
        display: block;
        line-height: 1.45;
      }
      .index-item small {
        display: block;
        color: #74808a;
        font-size: 11px;
        margin-top: 3px;
      }
      .index-item .project-icon {
        height: 29px;
        width: 29px;
        border: 1px solid #d2dce1;
        border-radius: 5px;
        display: grid;
        place-items: center;
      }
      .index .bottom-link {
        font-size: 12px;
        color: #687681;
        padding: 10px;
        width: 100%;
        text-align: left;
      }
      .index .bottom-link:hover {
        color: var(--accent);
      }
      .index .tiny-count {
        font-size: 10px;
      }
      .app.layout-c .index {
        display: block;
      }
      .app.layout-c.index-closed .index {
        display: none;
      }
      .index-resizer,
      .index-shade,
      .index-toggle {
        display: none;
      }
      .layout-c .index-toggle {
        display: inline-flex;
        align-items: center;
        padding: 4px;
        border-radius: 3px;
      }
      .index-toggle svg {
        width: 18px;
        height: 18px;
      }
      .layout-c:not(.index-closed):not(.narrow-shell) .index-resizer {
        display: block;
        position: absolute;
        z-index: 5;
        top: 0;
        bottom: 0;
        left: calc(var(--index-width) - 4px);
        width: 8px;
        cursor: col-resize;
        touch-action: none;
        outline-offset: -2px;
      }
      .index-resizer::after {
        content: "";
        position: absolute;
        inset: 0 3px;
        background: transparent;
      }
      .index-resizer:hover::after,
      .index-resizer:focus-visible::after,
      .resizing .index-resizer::after {
        background: var(--accent);
      }
      .app.resizing {
        user-select: none;
        cursor: col-resize;
      }
      .layout-c.resizing.index-closed .index-resizer {
        display: block;
        left: 0;
      }
      .layout-c.narrow-shell:not(.index-closed) .index {
        position: absolute;
        z-index: 4;
        inset: 0 auto 0 0;
        width: min(var(--index-width), calc(100% - 48px));
        box-shadow: 8px 0 20px #17252e1a;
      }
      .layout-c.narrow-shell:not(.index-closed) .index-shade {
        display: block;
        position: absolute;
        inset: 0;
        z-index: 3;
        background: #17252e35;
        width: 100%;
        border-radius: 0;
      }
      .chat {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
        background: var(--paper);
      }
      .pane-head {
        height: 70px;
        min-height: 70px;
        padding: 0 27px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .identity strong {
        font-size: 15px;
        font-weight: 600;
        display: block;
      }
      .identity small {
        display: block;
        font-size: 11px;
        color: #7a858d;
        margin-top: 4px;
      }
      .portrait {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #edf1f3;
        color: #485b65;
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid #e0e7ea;
      }
      .portrait.core {
        background: #e4edf0;
        color: #2a4b5d;
      }
      .portrait.core svg {
        width: 24px;
        height: 24px;
      }
      .portrait.designer {
        background: #eee9ed;
        color: #795b71;
      }
      .portrait.engineer {
        background: #e9eee9;
        color: #4d6554;
      }
      .pane-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .icon-button {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 4px;
        color: #6c7780;
      }
      .icon-button:hover {
        background: #edf1f3;
        color: #243f4e;
      }
      .chat-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 25px 32px 22px;
      }
      .chat-body {
        max-width: 700px;
        margin: 0 auto;
      }
      .dayline {
        font-size: 11px;
        color: #8b949a;
        text-align: center;
        margin: 0 0 27px;
      }
      .message {
        font-size: 14px;
        line-height: 1.85;
        margin: 0 0 25px;
        max-width: 100%;
      }
      .message .byline {
        font-size: 11px;
        line-height: 1.5;
        color: #7b858d;
        margin-bottom: 7px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .message .byline strong {
        color: #3a4a54;
        font-size: 12px;
        font-weight: 600;
      }
      .message.user {
        margin-left: auto;
        max-width: 85%;
        width: fit-content;
        background: #edf1f4;
        padding: 10px 14px;
        border-radius: 9px 9px 2px 9px;
        line-height: 1.7;
      }
      .message.assistant {
        padding: 0 3px;
      }
      .message .inline-person {
        color: #28556a;
        border-bottom: 1px solid #b8cbd5;
        padding: 0 1px;
        font-size: inherit;
      }
      .message .inline-person:hover {
        background: #e9f0f3;
      }
      .message .source-line {
        font-size: 11px;
        color: #7c878e;
        margin-top: 11px;
        display: flex;
        gap: 13px;
      }
      .message .source-line button {
        font-size: 11px;
        color: #4c6a7b;
        padding: 0;
      }
      .project-link {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        margin: 16px 0 6px;
        padding: 13px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        line-height: 1.5;
      }
      .project-link .link-copy {
        flex: 1;
      }
      .project-link strong {
        font-size: 13px;
        font-weight: 600;
        display: block;
      }
      .project-link small {
        font-size: 11px;
        color: #77838c;
        display: block;
        margin-top: 4px;
      }
      .project-link:hover {
        color: var(--accent);
      }
      .state-mark {
        width: 6px;
        height: 6px;
        background: #b48b4e;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .state-mark.running {
        background: #528774;
      }
      .state-mark.closed {
        background: #82909b;
      }
      .news-items {
        padding-left: 19px;
        margin: 13px 0;
        font-size: 13px;
      }
      .news-items li {
        margin-bottom: 8px;
        padding-left: 4px;
      }
      .news-items strong {
        font-weight: 600;
      }
      .composer {
        flex: none;
        padding: 14px 26px 18px;
        border-top: 1px solid var(--line);
        background: #fcfcfc;
      }
      .composer-inner {
        max-width: 720px;
        margin: auto;
      }
      .composer-field {
        position: relative;
      }
      .composer textarea {
        display: block;
        width: 100%;
        resize: none;
        border: 1px solid #d8e0e5;
        border-radius: 7px;
        min-height: 76px;
        padding: 12px 45px 12px 13px;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.6;
      }
      .composer textarea::placeholder {
        color: #8a949d;
      }
      .send {
        position: absolute;
        right: 8px;
        bottom: 8px;
        background: #2c5265;
        color: #fff;
        width: 28px;
        height: 28px;
        border-radius: 5px;
        display: grid;
        place-items: center;
      }
      .send svg {
        width: 16px;
        height: 16px;
      }
      .composer-hint {
        font-size: 10px;
        color: #8b969e;
        margin-top: 7px;
        display: flex;
        justify-content: space-between;
      }
      .workspace {
        display: none;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        background: #f7f8fa;
        overflow: hidden;
      }
      .app.has-workspace .workspace {
        display: flex;
      }
      .app.has-workspace.layout-a .chat,
      .app.has-workspace.layout-c .chat {
        display: none;
      }
      .app.has-workspace.layout-b .chat {
        flex: 0 0 365px;
        border-right: 1px solid #d8e0e5;
      }
      .app.has-workspace.layout-b .chat .pane-head {
        padding: 0 20px;
      }
      .app.has-workspace.layout-b .chat-scroll {
        padding: 22px 21px;
      }
      .app.has-workspace.layout-b .chat .composer {
        padding: 12px 18px;
      }
      .app.has-workspace.layout-b .chat .message {
        font-size: 13px;
        margin-bottom: 22px;
      }
      .app.has-workspace.layout-b .chat .pane-actions .wide-action {
        display: none;
      }
      .work-head {
        min-height: 62px;
        height: 62px;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        background: #fbfcfc;
        border-bottom: 1px solid var(--line);
      }
      .work-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .work-title strong {
        font-size: 14px;
        font-weight: 600;
        display: block;
      }
      .work-title small {
        display: block;
        font-size: 11px;
        color: #7c8891;
        margin-top: 3px;
      }
      .work-tabs {
        display: flex;
        gap: 22px;
        padding: 0 25px;
        height: 42px;
        min-height: 42px;
        background: #fbfcfc;
        border-bottom: 1px solid var(--line);
      }
      .work-tabs button {
        font-size: 12px;
        border-bottom: 2px solid transparent;
        padding: 0 1px;
        color: #6e7a83;
      }
      .work-tabs button.active {
        border-color: #2d5365;
        color: #2d5365;
        font-weight: 600;
      }
      .work-content {
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 24px 28px;
      }
      .project-stage {
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 12px;
        color: #526574;
        margin-bottom: 9px;
      }
      .work-content h2 {
        font-size: 21px;
        line-height: 1.5;
        letter-spacing: -0.4px;
        font-weight: 600;
        margin: 0 0 9px;
      }
      .work-content .lead {
        font-size: 12px;
        line-height: 1.8;
        color: #6f7c85;
        margin: 0 0 20px;
        max-width: 650px;
      }
      .artifact {
        border: 1px solid #d4dee4;
        border-radius: 5px;
        background: #fff;
        overflow: hidden;
        margin: 18px 0 20px;
      }
      .artifact-chrome {
        height: 29px;
        padding: 0 12px;
        background: #edf1f4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        color: #71818e;
        border-bottom: 1px solid #dbe3e8;
      }
      .artifact-preview {
        padding: 24px 26px 25px;
        min-height: 244px;
      }
      .artifact-preview .preview-title {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.4px;
        color: #293b48;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .artifact-preview .preview-title small {
        font-weight: 400;
        font-size: 10px;
        color: #9ca6af;
        letter-spacing: 0;
      }
      .artifact-preview .preview-subtitle {
        font-size: 11px;
        color: #7e8c97;
        margin: 8px 0 20px;
      }
      .artifact-preview .preview-topline {
        display: flex;
        gap: 18px;
        font-size: 11px;
        color: #758491;
        border-bottom: 1px solid #e5eaee;
        margin-bottom: 9px;
        padding-bottom: 9px;
      }
      .artifact-preview .preview-topline strong {
        color: #344e63;
        font-weight: 600;
      }
      .price-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        line-height: 1.65;
      }
      .price-table th {
        text-align: left;
        color: #84919b;
        font-weight: 400;
        padding: 7px 8px;
      }
      .price-table td {
        padding: 11px 8px;
        border-top: 1px solid #eaf0f3;
        color: #415767;
      }
      .price-table td:first-child {
        font-weight: 550;
      }
      .price-table .change {
        color: #397c67;
      }
      .price-table td:nth-child(3),
      .price-table th:nth-child(3) {
        text-align: right;
      }
      .artifact-foot {
        font-size: 10px;
        color: #8e9ba4;
        margin-top: 15px;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .file-row .file-main {
        flex: 1;
      }
      .file-row small {
        display: block;
        font-size: 10px;
        color: #7d8b95;
        margin-top: 4px;
      }
      .file-row button {
        font-size: 11px;
        color: #375e74;
      }
      .review-request {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .review-context {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 10px;
      }
      .review-request label {
        display: block;
        font-size: 13px;
        font-weight: 550;
        margin-bottom: 9px;
      }
      .review-request textarea {
        display: block;
        width: 100%;
        min-height: 66px;
        resize: vertical;
        max-height: 240px;
        border: 1px solid #d6dfe4;

    <script id="study-runtime">
      // Deterministic UI study only: no model, network or filesystem execution.
      class StudyConversation {
        constructor(changed = () => {}, schedule = setTimeout, cancel = clearTimeout) {
          this.changed = changed;
          this.schedule = schedule;
          this.cancel = cancel;
          this.rooms = new Map();
          this.sequence = 0;
        }
        room(key) {
          if (!this.rooms.has(key))
            this.rooms.set(key, { messages: [], queue: [], active: null, paused: false });
          return this.rooms.get(key);
        }
        send(key, input) {
          if (!input.text.trim() && !input.files?.length) return null;
          const packet = {
            ...input,
            files: (input.files || []).map((f) => ({ ...f })),
            id: "input-" + ++this.sequence,
          };
          const room = this.room(key);
          if (room.active || room.paused) {
            room.queue.push(packet);
            this.changed();
          } else this.start(key, packet);
          return packet.id;
        }
        start(key, packet, reply = null) {
          const room = this.room(key);
          if (room.active) return false;
          if (!room.messages.some((m) => m.id === packet.id))
            room.messages.push({ ...packet, role: "user" });
          if (!reply) {
            reply = {
              id: "reply-" + ++this.sequence,
              role: "assistant",
              text: "",
              status: "running",
              packet,
              attempt: 0,
            };
            room.messages.push(reply);
          }
          reply.status = "running";
          reply.attempt++;
          reply.text = "";
          const generation = ++this.sequence;
          const active = { reply, generation, timers: [] };
          room.active = active;
          const response = packet.response || "本轮演示回复已完成，没有调用模型。";
          active.timers.push(
            this.schedule(() => {
              if (room.active?.generation !== generation) return;
              reply.text = response.slice(0, Math.max(12, Math.floor(response.length / 2)));
              this.changed();
            }, 1000),
          );
          active.timers.push(this.schedule(() => this.finish(key, generation, response), 6500));
          this.changed();
          return true;
        }
        finish(key, generation, text) {
          const room = this.room(key);
          if (room.active?.generation !== generation) return false;
          const active = room.active;
          active.timers.forEach(this.cancel);
          active.reply.text = text;
          active.reply.status = "complete";
          room.active = null;
          if (!room.paused && room.queue.length) this.start(key, room.queue.shift());
          else this.changed();
          return true;
        }
        interrupt(key, status = "stopped") {
          const room = this.room(key);
          if (!room.active) return false;
          room.active.timers.forEach(this.cancel);
          room.active.reply.status = status;
          room.active = null;
          room.paused = room.queue.length > 0;
          this.changed();
          return true;
        }
        retry(key, replyID) {
          const room = this.room(key);
          const reply = room.messages.find((m) => m.id === replyID);
          if (room.active || !reply || !["failed", "stopped"].includes(reply.status)) return false;
          return this.start(key, reply.packet, reply);
        }
        withdraw(key, id) {
          const room = this.room(key);
          const index = room.queue.findIndex((m) => m.id === id);
          if (index < 0) return null;
          const [packet] = room.queue.splice(index, 1);
          if (!room.queue.length && !room.active) room.paused = false;
          this.changed();
          return packet;
        }
        prioritize(key, id) {
          const room = this.room(key);
          const index = room.queue.findIndex((m) => m.id === id);
          if (index < 0) return false;
          const [packet] = room.queue.splice(index, 1);
          this.interrupt(key);
          room.paused = room.queue.length > 0;
          return this.start(key, packet);
        }
        resume(key) {
          const room = this.room(key);
          if (room.active || !room.queue.length) return false;
          room.paused = false;
          return this.start(key, room.queue.shift());
        }
        reset() {
          for (const room of this.rooms.values()) room.active?.timers.forEach(this.cancel);
          this.rooms.clear();
        }
      }
      class StudyWork {
        constructor() {
          this.generation = 0;
          this.create();
        }
        create() {
          this.generation++;
          this.status = "permission";
          this.grant = null;
          this.uncertain = false;
          this.steps = [
            { title: "读取现有说明", state: "pending" },
            { title: "修改计价单位说明", state: "pending" },
            { title: "核对文件与界面", state: "pending" },
          ];
        }
        decide(generation, decision) {
          if (
            this.status !== "permission" ||
            generation !== this.generation ||
            !["once", "project", "deny"].includes(decision)
          )
            return false;
          if (decision === "deny") {
            this.status = "denied";
            this.generation++;
            return true;
          }
          this.grant = decision;
          if (this.uncertain) {
            this.status = "checking";
            return true;
          }
          this.status = "running";
          this.steps.find((s) => s.state !== "complete").state = "running";
          return true;
        }
        advance() {
          if (this.status !== "running") return false;
          this.steps.find((s) => s.state === "running").state = "complete";
          const next = this.steps.find((s) => s.state !== "complete");
          if (next) next.state = "running";
          else this.status = "complete";
          return true;
        }
        interrupt(reason = "failed") {
          if (!["running", "permission"].includes(this.status)) return false;
          const step = this.steps.find((s) => s.state === "running");
          this.uncertain = step === this.steps[1];
          if (step) step.state = "pending";
          this.status = reason;
          this.generation++;
          return true;
        }
        resume() {
          if (!["failed", "stopped"].includes(this.status) || !this.grant) return false;
          if (this.uncertain) {
            this.status = "checking";
            return true;
          }
          this.status = "running";
          this.steps.find((s) => s.state !== "complete").state = "running";
          return true;
        }
        reconcile(applied) {
          if (this.status !== "checking" || typeof applied !== "boolean") return false;
          if (applied) this.steps[1].state = "complete";
          this.uncertain = false;
          this.status = "running";
          this.steps.find((s) => s.state !== "complete").state = "running";
          return true;
        }
        revoke() {
          if (!this.grant) return false;
          if (this.status === "running") this.interrupt("stopped");
          this.grant = null;
          this.generation++;
          if (!["complete", "denied"].includes(this.status)) this.status = "revoked";
          return true;
        }
        requestAccess() {
          if (!["denied", "revoked", "stopped"].includes(this.status) || this.grant) return false;
          this.generation++;
          this.status = "permission";
          return true;
        }
      }
    </script>

        (e) => {
          const target = e.target === document ? document.documentElement : e.target;
          if (!(target instanceof Element)) return;
          if (target.matches(".chat-scroll")) {
            const jump = $(".jump-latest");
            if (jump)
              jump.hidden = target.scrollHeight - target.scrollTop - target.clientHeight < 80;
          }
          target.classList.add("scroll-active");
          clearTimeout(scrollTimers.get(target));
          scrollTimers.set(
            target,
            setTimeout(() => target.classList.remove("scroll-active"), 900),
          );
        },
        true,
      );
      render();
      new ResizeObserver(syncIndex).observe($("#app"));
    </script>
  </body>
</html>
