<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Noema · 三种空间组织</title>
    <style>
      :root {
        font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
        color: #20282d;
        background: #e9ecee;
        font-size: 14px;
        font-synthesis: none;
        --ink: #20282d;
        --muted: #68727b;
        --line: #e3e7e9;
        --accent: #28556a;
        --soft: #eef3f5;
        --paper: #fcfcfc;
      }
      * {
        box-sizing: border-box;
      }
      :where(html, .index, .chat-scroll, .work-content, .session-scroll, .dialog-body, textarea) {
        scrollbar-gutter: stable;
      }
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: transparent transparent;
        }
        html.scroll-active,
        :where(.index, .chat-scroll, .work-content, .session-scroll, .dialog-body, textarea):is(
          :hover,
          :focus-within,
          .scroll-active
        ) {
          scrollbar-color: #a5b0b8 transparent;
        }
      }
      @supports selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: auto;
          scrollbar-color: auto;
        }
        ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
        }
        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
          background: transparent;
        }
        ::-webkit-scrollbar-button {
          display: none;
          width: 0;
          height: 0;
        }
        ::-webkit-scrollbar-thumb {
          background: transparent;
          border: 2px solid transparent;
          border-radius: 8px;
          background-clip: padding-box;
        }
        html.scroll-active::-webkit-scrollbar-thumb,
        :where(.index, .chat-scroll, .work-content, .session-scroll, .dialog-body, textarea):is(
            :hover,
            :focus-within,
            .scroll-active
          )::-webkit-scrollbar-thumb {
          background-color: #a5b0b8;
        }
        ::-webkit-scrollbar-thumb:hover {
          background-color: #77858f;
        }
      }
      @media (forced-colors: active) {
        * {
          scrollbar-color: auto;
        }
        ::-webkit-scrollbar-thumb {
          background-color: ButtonText;
        }
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        color: #869098;
      }
      button,
      a,
      input,
      textarea {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #27779c;
      }
      button {
        background: transparent;
        border: 0;
      }
      svg {
        width: 19px;
        height: 19px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      p {
        margin: 0 0 12px;
      }
      p:last-child {
        margin: 0;
      }
      .study-head {
        height: 58px;
        padding: 0 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: #f6f7f8;
        border-bottom: 1px solid #d9dfe3;
      }
      .study-head strong {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.4px;
      }
      .study-head span {
        font-size: 12px;
        color: #5f6b74;
        margin-left: 13px;
      }
      .study-head .study-meta {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .study-meta button {
        font-size: 12px;
        padding: 7px 10px;
        border: 1px solid #d5dce0;
        border-radius: 4px;
      }
      .study-controls {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 24px;
        align-items: center;
        background: #f6f7f8;
      }
      .variants,
      .scenes {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .variants button {
        padding: 9px 14px;
        font-size: 13px;
        border: 1px solid transparent;
        border-radius: 4px;
      }
      .variants button[aria-pressed="true"] {
        background: #263c47;
        color: white;
        border-color: #263c47;
      }
      .variants small {
        opacity: 0.7;
        margin-left: 6px;
      }
      .scenes button {
        font-size: 12px;
        color: #5b6670;
        padding: 7px 10px;
        border-bottom: 2px solid transparent;
      }
      .scenes button[aria-pressed="true"] {
        color: #1f4e62;
        border-bottom-color: #28556a;
      }
      .stage {
        padding: 7px 18px 0;
      }
      .app {
        container-type: inline-size;
        margin: auto;
        width: 100%;
        height: calc(100dvh - 180px);
        min-height: 470px;
        background: var(--paper);
        border: 1px solid #cdd5db;
        border-radius: 7px;
        box-shadow: 0 8px 28px #2336420a;
        overflow: hidden;
        transition: width 0.18s;
      }
      .stage.narrow .app {
        width: min(420px, 100%);
      }
      .window-head {
        height: 38px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 17px;
        background: #f6f7f8;
      }
      .wordmark {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .logo {
        display: inline-flex;
        width: 20px;
        height: 20px;
        align-items: center;
        justify-content: center;
      }
      .logo svg {
        width: 20px;
        height: 20px;
        stroke-width: 1.5;
      }
      .window-tools {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .window-tools button {
        font-size: 12px;
        padding: 3px 5px;
        color: #64717a;
      }
      .window-controls {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-left: 12px;
      }
      .window-tools .window-control {
        width: 32px;
        height: 30px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .window-control svg {
        width: 12px;
        height: 12px;
        stroke-width: 1.4;
        stroke-linecap: square;
      }
      .shell {
        position: relative;
        height: calc(100% - 38px);
        display: flex;
        min-width: 0;
        overflow: hidden;
      }
      .index {
        flex: 0 0 var(--index-width, 232px);
        min-width: 0;
        border-right: 1px solid var(--line);
        background: #f7f8f9;
        padding: 20px 10px 12px;
        display: none;
        overflow: auto;
      }
      .index .section-title {
        font-size: 11px;
        color: #727d85;
        margin: 23px 10px 8px;
        display: flex;
        justify-content: space-between;
      }
      .index .section-title:first-child {
        margin-top: 0;
      }
      .index .index-item {
        width: 100%;
        display: flex;
        gap: 10px;
        align-items: center;
        text-align: left;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 3px;
      }
      .index .index-item:hover {
        background: #edf0f2;
      }
      .index .index-item.selected {
        background: #e7edef;
        color: #1f4658;
      }
      .index-item .item-title {
        font-weight: 550;
        font-size: 13px;
        display: block;
        line-height: 1.45;
      }
      .index-item small {
        display: block;
        color: #74808a;
        font-size: 11px;
        margin-top: 3px;
      }
      .index-item .project-icon {
        height: 29px;
        width: 29px;
        border: 1px solid #d2dce1;
        border-radius: 5px;
        display: grid;
        place-items: center;
      }
      .index .bottom-link {
        font-size: 12px;
        color: #687681;
        padding: 10px;
        width: 100%;
        text-align: left;
      }
      .index .bottom-link:hover {
        color: var(--accent);
      }
      .index .tiny-count {
        font-size: 10px;
      }
      .app.layout-c .index {
        display: block;
      }
      .app.layout-c.index-closed .index {
        display: none;
      }
      .index-resizer,
      .index-shade,
      .index-toggle {
        display: none;
      }
      .layout-c .index-toggle {
        display: inline-flex;
        align-items: center;
        padding: 4px;
        border-radius: 3px;
      }
      .index-toggle svg {
        width: 18px;
        height: 18px;
      }
      .layout-c:not(.index-closed):not(.narrow-shell) .index-resizer {
        display: block;
        position: absolute;
        z-index: 5;
        top: 0;
        bottom: 0;
        left: calc(var(--index-width) - 4px);
        width: 8px;
        cursor: col-resize;
        touch-action: none;
        outline-offset: -2px;
      }
      .index-resizer::after {
        content: "";
        position: absolute;
        inset: 0 3px;
        background: transparent;
      }
      .index-resizer:hover::after,
      .index-resizer:focus-visible::after,
      .resizing .index-resizer::after {
        background: var(--accent);
      }
      .app.resizing {
        user-select: none;
        cursor: col-resize;
      }
      .layout-c.resizing.index-closed .index-resizer {
        display: block;
        left: 0;
      }
      .layout-c.narrow-shell:not(.index-closed) .index {
        position: absolute;
        z-index: 4;
        inset: 0 auto 0 0;
        width: min(var(--index-width), calc(100% - 48px));
        box-shadow: 8px 0 20px #17252e1a;
      }
      .layout-c.narrow-shell:not(.index-closed) .index-shade {
        display: block;
        position: absolute;
        inset: 0;
        z-index: 3;
        background: #17252e35;
        width: 100%;
        border-radius: 0;
      }
      .chat {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
        background: var(--paper);
      }
      .pane-head {
        height: 70px;
        min-height: 70px;
        padding: 0 27px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .identity strong {
        font-size: 15px;
        font-weight: 600;
        display: block;
      }
      .identity small {
        display: block;
        font-size: 11px;
        color: #7a858d;
        margin-top: 4px;
      }
      .portrait {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #edf1f3;
        color: #485b65;
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid #e0e7ea;
      }
      .portrait.core {
        background: #e4edf0;
        color: #2a4b5d;
      }
      .portrait.core svg {
        width: 24px;
        height: 24px;
      }
      .portrait.designer {
        background: #eee9ed;
        color: #795b71;
      }
      .portrait.engineer {
        background: #e9eee9;
        color: #4d6554;
      }
      .pane-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .icon-button {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 4px;
        color: #6c7780;
      }
      .icon-button:hover {
        background: #edf1f3;
        color: #243f4e;
      }
      .chat-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 25px 32px 22px;
      }
      .chat-body {
        max-width: 700px;
        margin: 0 auto;
      }
      .dayline {
        font-size: 11px;
        color: #8b949a;
        text-align: center;
        margin: 0 0 27px;
      }
      .message {
        font-size: 14px;
        line-height: 1.85;
        margin: 0 0 25px;
        max-width: 100%;
      }
      .message .byline {
        font-size: 11px;
        line-height: 1.5;
        color: #7b858d;
        margin-bottom: 7px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .message .byline strong {
        color: #3a4a54;
        font-size: 12px;
        font-weight: 600;
      }
      .message.user {
        margin-left: auto;
        max-width: 85%;
        width: fit-content;
        background: #edf1f4;
        padding: 10px 14px;
        border-radius: 9px 9px 2px 9px;
        line-height: 1.7;
      }
      .message.assistant {
        padding: 0 3px;
      }
      .message .inline-person {
        color: #28556a;
        border-bottom: 1px solid #b8cbd5;
        padding: 0 1px;
        font-size: inherit;
      }
      .message .inline-person:hover {
        background: #e9f0f3;
      }
      .message .source-line {
        font-size: 11px;
        color: #7c878e;
        margin-top: 11px;
        display: flex;
        gap: 13px;
      }
      .message .source-line button {
        font-size: 11px;
        color: #4c6a7b;
        padding: 0;
      }
      .project-link {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        margin: 16px 0 6px;
        padding: 13px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        line-height: 1.5;
      }
      .project-link .link-copy {
        flex: 1;
      }
      .project-link strong {
        font-size: 13px;
        font-weight: 600;
        display: block;
      }
      .project-link small {
        font-size: 11px;
        color: #77838c;
        display: block;
        margin-top: 4px;
      }
      .project-link:hover {
        color: var(--accent);
      }
      .state-mark {
        width: 6px;
        height: 6px;
        background: #b48b4e;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .state-mark.running {
        background: #528774;
      }
      .state-mark.closed {
        background: #82909b;
      }
      .news-items {
        padding-left: 19px;
        margin: 13px 0;
        font-size: 13px;
      }
      .news-items li {
        margin-bottom: 8px;
        padding-left: 4px;
      }
      .news-items strong {
        font-weight: 600;
      }
      .composer {
        flex: none;
        padding: 14px 26px 18px;
        border-top: 1px solid var(--line);
        background: #fcfcfc;
      }
      .composer-inner {
        max-width: 720px;
        margin: auto;
      }
      .composer-field {
        position: relative;
      }
      .composer textarea {
        display: block;
        width: 100%;
        resize: none;
        border: 1px solid #d8e0e5;
        border-radius: 7px;
        min-height: 76px;
        padding: 12px 45px 12px 13px;
        background: #fff;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.6;
      }
      .composer textarea::placeholder {
        color: #8a949d;
      }
      .send {
        position: absolute;
        right: 8px;
        bottom: 8px;
        background: #2c5265;
        color: #fff;
        width: 28px;
        height: 28px;
        border-radius: 5px;
        display: grid;
        place-items: center;
      }
      .send svg {
        width: 16px;
        height: 16px;
      }
      .composer-hint {
        font-size: 10px;
        color: #8b969e;
        margin-top: 7px;
        display: flex;
        justify-content: space-between;
      }
      .workspace {
        display: none;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        background: #f7f8fa;
        overflow: hidden;
      }
      .app.has-workspace .workspace {
        display: flex;
      }
      .app.has-workspace.layout-a .chat,
      .app.has-workspace.layout-c .chat {
        display: none;
      }
      .app.has-workspace.layout-b .chat {
        flex: 0 0 365px;
        border-right: 1px solid #d8e0e5;
      }
      .app.has-workspace.layout-b .chat .pane-head {
        padding: 0 20px;
      }
      .app.has-workspace.layout-b .chat-scroll {
        padding: 22px 21px;
      }
      .app.has-workspace.layout-b .chat .composer {
        padding: 12px 18px;
      }
      .app.has-workspace.layout-b .chat .message {
        font-size: 13px;
        margin-bottom: 22px;
      }
      .app.has-workspace.layout-b .chat .pane-actions .wide-action {
        display: none;
      }
      .work-head {
        min-height: 62px;
        height: 62px;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        background: #fbfcfc;
        border-bottom: 1px solid var(--line);
      }
      .work-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .work-title strong {
        font-size: 14px;
        font-weight: 600;
        display: block;
      }
      .work-title small {
        display: block;
        font-size: 11px;
        color: #7c8891;
        margin-top: 3px;
      }
      .work-tabs {
        display: flex;
        gap: 22px;
        padding: 0 25px;
        height: 42px;
        min-height: 42px;
        background: #fbfcfc;
        border-bottom: 1px solid var(--line);
      }
      .work-tabs button {
        font-size: 12px;
        border-bottom: 2px solid transparent;
        padding: 0 1px;
        color: #6e7a83;
      }
      .work-tabs button.active {
        border-color: #2d5365;
        color: #2d5365;
        font-weight: 600;
      }
      .work-content {
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 24px 28px;
      }
      .project-stage {
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 12px;
        color: #526574;
        margin-bottom: 9px;
      }
      .work-content h2 {
        font-size: 21px;
        line-height: 1.5;
        letter-spacing: -0.4px;
        font-weight: 600;
        margin: 0 0 9px;
      }
      .work-content .lead {
        font-size: 12px;
        line-height: 1.8;
        color: #6f7c85;
        margin: 0 0 20px;
        max-width: 650px;
      }
      .artifact {
        border: 1px solid #d4dee4;
        border-radius: 5px;
        background: #fff;
        overflow: hidden;
        margin: 18px 0 20px;
      }
      .artifact-chrome {
        height: 29px;
        padding: 0 12px;
        background: #edf1f4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10px;
        color: #71818e;
        border-bottom: 1px solid #dbe3e8;
      }
      .artifact-preview {
        padding: 24px 26px 25px;
        min-height: 244px;
      }
      .artifact-preview .preview-title {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.4px;
        color: #293b48;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .artifact-preview .preview-title small {
        font-weight: 400;
        font-size: 10px;
        color: #9ca6af;
        letter-spacing: 0;
      }
      .artifact-preview .preview-subtitle {
        font-size: 11px;
        color: #7e8c97;
        margin: 8px 0 20px;
      }
      .artifact-preview .preview-topline {
        display: flex;
        gap: 18px;
        font-size: 11px;
        color: #758491;
        border-bottom: 1px solid #e5eaee;
        margin-bottom: 9px;
        padding-bottom: 9px;
      }
      .artifact-preview .preview-topline strong {
        color: #344e63;
        font-weight: 600;
      }
      .price-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        line-height: 1.65;
      }
      .price-table th {
        text-align: left;
        color: #84919b;
        font-weight: 400;
        padding: 7px 8px;
      }
      .price-table td {
        padding: 11px 8px;
        border-top: 1px solid #eaf0f3;
        color: #415767;
      }
      .price-table td:first-child {
        font-weight: 550;
      }
      .price-table .change {
        color: #397c67;
      }
      .price-table td:nth-child(3),
      .price-table th:nth-child(3) {
        text-align: right;
      }
      .artifact-foot {
        font-size: 10px;
        color: #8e9ba4;
        margin-top: 15px;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .file-row .file-main {
        flex: 1;
      }
      .file-row small {
        display: block;
        font-size: 10px;
        color: #7d8b95;
        margin-top: 4px;
      }
      .file-row button {
        font-size: 11px;
        color: #375e74;
      }
      .review-request {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .review-context {
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 10px;
      }
      .review-request label {
        display: block;
        font-size: 13px;
        font-weight: 550;
        margin-bottom: 9px;
      }
      .review-request textarea {
        display: block;
        width: 100%;
        min-height: 66px;
        resize: vertical;
        max-height: 240px;
        border: 1px solid #d6dfe4;

  <body>
    <header class="study-head">
      <div><strong>Noema / 三种空间组织</strong><span>同一套产品关系，不同的界面重心</span></div>

        <span>交互研究 · 全部为演示数据，不调用模型</span
        ><button data-action="narrow">窄窗对照</button><button data-action="focus">进入预览</button>
      </div>
    </header>
    <div class="study-controls">
      <nav class="variants" aria-label="结构方案">
        <button data-layout="a">A · 对话主轴</button
        ><button data-layout="b">B · 对话与工作并置</button
        ><button data-layout="c">C · 成员与项目索引<small>已选空间结构</small></button>
      </nav>
      <nav class="scenes" aria-label="同一组使用情境">
        <button data-scene="daily">日常相处</button><button data-scene="news">新闻短委托</button
        ><button data-scene="project">组建项目</button><button data-scene="review">交付评审</button
        ><button data-scene="archive">归档与恢复</button>
      </nav>
    </div>
    <main class="stage" id="stage">
      <section class="app" id="app" aria-label="Noema 交互研究"></section>
    </main>
    <footer class="study-note" id="study-note"></footer>
    <button class="preview-exit" data-action="focus">退出预览</button>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <script>
      "use strict";
      const $ = (s) => document.querySelector(s);
      const state = {
        layout: "c",
        indexWidth: 232,
        indexOpen: true,
        mobileIndexOpen: false,
        scene: "review",
        workspace: null,
        projectStage: "review",
        tab: "delivery",
        member: "research",
        name: "Noema",
        preference: "直接交流，必要时说清依据。",
        approved: false,
        archived: false,
        narrow: false,
        focused: false,
        drafts: {},
        feedback: "",
        extra: {},
        groupExtra: [],
        sessionExtra: {},
        notice: "",
        reopened: false,
      };
      const people = {
        research: {
          name: "新闻观察者",
          role: "研究 · 来源核对",
          mark: "研",
          class: "",
          status: "研究已交付",
          description: "寻找原始信息，核对变化与时间，分清事实和推断。",
        },
        designer: {
          name: "界面设计师",
          role: "交互 · 视觉",
          mark: "设",
          class: "designer",
          status: "等待界面评审",
          description: "把需求转成可审阅的界面，说明设计取舍并修正体验。",
        },
        engineer: {
          name: "应用工程师",
          role: "实现 · 验证",
          mark: "工",
          class: "engineer",
          status: "等待评审结果",
          description: "实现经过确认的方案，验证结果，维护项目的可运行状态。",
        },
      };
      const notes = {
        a: {
          title: "A · 对话主轴",
          text: "Noema 对话占据整个窗口。成员与项目按需整页打开，返回后继续原来的对话。",
          risk: "取舍：日常最轻；看成果与讨论需要来回切换。",
        },
        b: {
          title: "B · 对话与工作并置",
          text: "默认仍是完整对话。打开项目时，对话留在左侧，项目与成果在右侧展开。",
          risk: "取舍：边看边谈最直接；小窗口改为单页，不能强挤双栏。",
        },
        c: {
          title: "C · 成员与项目索引",
          text: "已选空间结构：左侧导航可拖动调宽、拖至左缘收起，也可用顶栏按钮开闭。内容区域在主聊、成员和项目之间切换。",
          risk: "本轮只确认空间组织；视觉语言、组件细节和整体体验仍待评审。A / B 保留作历史对照。",
        },
      };
      function esc(x) {
        return String(x ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      }
      function icon(n) {
        const paths = {
          arrow: '<path d="M5 12h14m-5-5 5 5-5 5"/>',
          back: '<path d="m13 6-6 6 6 6m-6-6h12"/>',
          close: '<path d="m6 6 12 12M18 6 6 18"/>',
          send: '<path d="m12 5 0 14M6 11l6-6 6 6"/>',
          people:
            '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/>',
          project:
            '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 11h16m-11 4h6"/>',
          settings:
            '<path d="M5 7h14M5 17h14"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="17" r="2" fill="currentColor"/>',
          link: '<path d="M8 5H5v14h14v-3m-7-11h7v7m0-7L9 15"/>',
          file: '<path d="M7 3h7l4 4v14H7V3Zm7 0v5h4M10 12h5m-5 4h5"/>',
          archive:
            '<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8m-10 5h6"/>',
          noema: '<path d="M5 18V9a5 5 0 0 1 10 0v9M9 18V9m10 9V6"/>',
        };
        return (
          '<svg aria-hidden="true" viewBox="0 0 24 24">' + (paths[n] || paths.noema) + "</svg>"
        );
      }
      function avatar(id) {
        if (id === "core") return '<span class="portrait core">' + icon("noema") + "</span>";
        const p = people[id];
        return '<span class="portrait ' + p.class + '">' + p.mark + "</span>";
      }
      function button(action, content, cls = "", extra = "") {
        return (
          '<button data-action="' +
          action +
          '" class="' +
          cls +
          '" ' +
          extra +
          ">" +
          content +
          "</button>"
        );
      }
      function message(who, html, time = "14:26", person = "") {
        const name = who === "assistant" ? state.name : who === "user" ? "你" : who;
        return (
          '<article class="message ' +
          (who === "user" ? "user" : "assistant") +
          '">' +
          (who === "user"
            ? ""
            : '<div class="byline"><strong>' +
              esc(name) +
              "</strong><span>" +
              time +
              "</span></div>") +
          html +
          "</article>"
        );
      }
      function projectLink() {
        return button(
          "open-project",
          icon("project") +
            '<span class="link-copy"><strong>AI 服务价格追踪器</strong><small>' +
            (state.archived
              ? "已归档 · 随时可以续接"
              : state.reopened
                ? "已恢复 · 小修订进行中"
                : state.approved
                  ? "已反馈 · 正在继续实现"
                  : state.feedback
                    ? "反馈已提交 · Noema 处理中"
                    : state.projectStage === "forming"
                      ? "团队已组建 · 研究与设计中"
                      : "界面第一版 · 等待你评审") +
            "</small></span>" +
            icon("link"),
          "project-link",
        );
      }
      function personLink(id) {
        return button(
          "member-main",
          esc(people[id].name),
          "inline-person",
          'data-member="' + id + '"',
        );
      }

        if (!form.dataset.form) return;
        e.preventDefault();
        const kind = form.dataset.form;
        if (kind === "settings") {
          const data = new FormData(form);
          state.name = String(data.get("name")).trim() || "Noema";
          state.preference = String(data.get("preference")).trim();
          $("#dialog").close();
          addCore("<p>我现在叫 " + esc(state.name) + "。你在设置里写的交流偏好也已经收到。</p>");
          render();
          return;
        }
        if (kind === "review") {
          const feedback = form.querySelector("textarea").value.trim();
          if (!feedback) {
            $("#review-feedback").focus();
            $("#review-feedback").setCustomValidity("请填写反馈内容。");
            $("#review-feedback").reportValidity();
            $("#review-feedback").setCustomValidity("");
            return;
          }
          state.feedback = feedback;
          state.drafts.review = "";
          state.notice = "你的反馈：" + feedback;
          addCore(
            "<p>收到反馈。我先梳理这版需要调整的地方；向团队确认下一步之前，相关开发保持暂停。</p>",
          );
          render();
          return;
        }
        if (kind === "group") {
          const input = form.querySelector("input");
          if (!input.value.trim()) return;
          state.groupExtra.push("<p>" + esc(input.value.trim()) + "</p>");
          render();
          return;
        }
        if (kind === "chat") {
          const scope = form.dataset.scope,
            text = form.querySelector("textarea").value.trim();
          if (!text) return;
          state.drafts[scope] = "";
          if (scope === "core") {
            addCore("<p>" + esc(text) + "</p>", "user");
            let reply = "<p>这条消息已进入演示对话。正式产品会在这里理解你的需求并回应。</p>";
            if (/归档|收起项目/.test(text)) {
              state.archived = true;
              reply = "<p>演示：项目已从活跃列表收起，记录与成员会话保留。</p>";
            } else if (/恢复|重新打开/.test(text)) {
              state.archived = false;
              reply = "<p>演示：原项目已恢复，成员继续原来的工作会话。</p>" + projectLink();
            } else if (/改名|叫你|名字/.test(text)) {
              reply = "<p>可以通过导航里的伙伴设置调整名字和交流偏好；本页只模拟这条设置链路。</p>";
            }
            addCore(reply);
          } else {
            (state.sessionExtra[scope] ??= []).push(
              message("你", "<p>" + esc(text) + "</p>", "刚刚"),
            );
            state.sessionExtra[scope].push(
              message(
                people[state.member].name,
                "<p>收到。这条消息只在当前" +
                  (scope.startsWith("main") ? "日常私聊" : "项目工作会话") +
                  "中回应，不会作为你的私聊消息转给 Noema。</p>",
                "刚刚",
              ),
            );
          }
          render();
          const input = document.querySelector('textarea[data-draft="' + scope + '"]');
          if (input) input.focus();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "Enter" &&
          !e.shiftKey &&
          !e.isComposing &&
          e.target.matches(".composer textarea")
        ) {
          e.preventDefault();
          e.target.form.requestSubmit();
        }
      });
      const scrollTimers = new WeakMap();
      document.addEventListener(
        "scroll",
        (e) => {
          const target = e.target === document ? document.documentElement : e.target;
          if (!(target instanceof Element)) return;
          target.classList.add("scroll-active");
          clearTimeout(scrollTimers.get(target));
          scrollTimers.set(
            target,
            setTimeout(() => target.classList.remove("scroll-active"), 900),
          );
        },
        true,
      );
      render();
      new ResizeObserver(syncIndex).observe($("#app"));
    </script>
  </body>
</html>
