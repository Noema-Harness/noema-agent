<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .ui { font-family: 'Segoe UI Variable','Microsoft YaHei UI',sans-serif; }
      .mono { font-family: 'Cascadia Code','Consolas',monospace; }
      .ink { fill:#202724 } .sub { fill:#66716b } .faint { fill:#919a94 }
      .paper { fill:#f4f5f1 } .white { fill:#fff } .line { stroke:#d4d9d4 }
      .accent { fill:#a13b2b } .accent-stroke { stroke:#a13b2b }
      .small { font-size:11px } .tiny { font-size:9px } .body { font-size:13px }
      .title { font-size:17px;font-weight:650;letter-spacing:-.02em }
      .label { font-size:10px;font-weight:650;letter-spacing:.08em }
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#eceee9"/>
  <g class="ui">
    <text x="54" y="48" class="label accent">NOEMA / 主聊与持续事项</text>
    <text x="54" y="87" class="ink" font-size="29" font-weight="650" letter-spacing="-.04em">同一段关系，三种时间尺度</text>
    <text x="54" y="116" class="sub" font-size="13">普通交流留在主聊。需要最新资料时明确能力边界。事情确实跨日，再从原话分出可返回的主题。</text>
    <rect x="1281" y="40" width="265" height="30" fill="#fff" stroke="#c8cfca"/>
    <text x="1296" y="59" class="small ink">设计候选 · 局部交互未定 · 非最终品牌</text>

    <!-- Screen 1 -->
    <g transform="translate(54,153)">
      <text x="0" y="0" class="label accent">01 / 日常对话</text>
      <text x="0" y="20" class="small sub">不出现任务模式、工作卡或选择 agent</text>
      <rect x="0" y="37" width="480" height="600" fill="#fff" stroke="#cbd1cc"/>
      <rect x="0" y="37" width="134" height="600" fill="#e5e9e3"/>
      <text x="16" y="64" class="ink" font-size="13" font-weight="700" letter-spacing=".06em">NOEMA</text>
      <line x1="15" y1="79" x2="119" y2="79" class="line"/>
      <text x="16" y="103" class="tiny sub">查找对话　⌘K</text>
      <line x1="15" y1="114" x2="119" y2="114" class="line"/>
      <rect x="9" y="125" width="116" height="36" fill="#fff"/>
      <rect x="9" y="125" width="2" height="36" fill="#a13b2b"/>
      <text x="18" y="140" class="small ink" font-weight="650">Noema</text>
      <text x="18" y="153" class="tiny sub">主聊 · 刚刚</text>
      <text x="17" y="185" class="tiny sub">最近</text>
      <text x="18" y="207" class="small ink">价格跟踪计划</text>
      <text x="18" y="220" class="tiny sub">昨天 · 主题聊天</text>
      <text x="18" y="250" class="small ink">周末安排</text>
      <text x="18" y="263" class="tiny sub">周一</text>
      <line x1="15" y1="586" x2="119" y2="586" class="line"/>
      <text x="17" y="608" class="tiny sub">连接与设置</text>

      <rect x="134" y="37" width="346" height="42" fill="#fff"/>
      <text x="153" y="56" class="small ink" font-weight="650">Noema</text>
      <text x="153" y="70" class="tiny sub">个人对话</text>
      <line x1="134" y1="79" x2="480" y2="79" class="line"/>
      <text x="153" y="102" class="tiny faint">今天　19:42</text>
      <text x="153" y="131" class="small ink" font-weight="600">你</text>
      <text x="153" y="150" class="body ink">最近事情有点多，脑子停不下来。</text>
      <text x="153" y="177" class="small ink" font-weight="600">Noema</text>
      <text x="153" y="198" class="body ink">听起来像是事情都还在你脑子里排队。</text>
      <text x="153" y="218" class="body ink">我们先不急着找解决办法。今晚最占着</text>
      <text x="153" y="238" class="body ink">你的那件事是什么？</text>
      <text x="153" y="276" class="small ink" font-weight="600">你</text>
      <text x="153" y="296" class="body ink">帮我把这句话写得不那么生硬：</text>
      <text x="153" y="316" class="body ink">“周五前把方案给我。”</text>
      <text x="153" y="347" class="small ink" font-weight="600">Noema</text>
      <text x="153" y="368" class="body ink">“方便的话，能否在周五前把方案发我？</text>
      <text x="153" y="388" class="body ink">我想留些时间看一遍，有需要再一起调整。”</text>
      <line x1="153" y1="405" x2="458" y2="405" class="line"/>
      <text x="153" y="425" class="tiny sub">按消息操作：回复 · 复制 · 从这里开主题</text>
      <rect x="148" y="543" width="320" height="76" fill="#fafbf8" stroke="#cbd1cc"/>
      <text x="162" y="566" class="small sub">给 Noema 发消息…</text>
      <line x1="148" y1="585" x2="468" y2="585" class="line"/>
      <text x="162" y="604" class="tiny faint">Enter 发送　·　Shift + Enter 换行</text>
      <text x="423" y="604" class="tiny accent">发送 ↗</text>
    </g>

    <!-- Screen 2 -->
    <g transform="translate(560,153)">
      <text x="0" y="0" class="label accent">02 / 需要当前资料</text>
      <text x="0" y="20" class="small sub">能力缺失时直说，不伪造研究进度或来源</text>
      <rect x="0" y="37" width="480" height="600" fill="#fff" stroke="#cbd1cc"/>
      <rect x="0" y="37" width="134" height="600" fill="#e5e9e3"/>
      <text x="16" y="64" class="ink" font-size="13" font-weight="700" letter-spacing=".06em">NOEMA</text>
      <line x1="15" y1="79" x2="119" y2="79" class="line"/>
      <text x="16" y="103" class="tiny sub">查找对话　⌘K</text>
      <line x1="15" y1="114" x2="119" y2="114" class="line"/>
      <rect x="9" y="125" width="116" height="36" fill="#fff"/>
      <rect x="9" y="125" width="2" height="36" fill="#a13b2b"/>
      <text x="18" y="140" class="small ink" font-weight="650">Noema</text>
      <text x="18" y="153" class="tiny sub">主聊 · 刚刚</text>
      <text x="17" y="185" class="tiny sub">最近</text>
      <text x="18" y="207" class="small ink">价格跟踪计划</text>
      <text x="18" y="220" class="tiny sub">昨天 · 主题聊天</text>
      <text x="18" y="250" class="small ink">周末安排</text>
      <text x="18" y="263" class="tiny sub">周一</text>
      <line x1="15" y1="586" x2="119" y2="586" class="line"/>
      <text x="17" y="608" class="tiny sub">连接与设置</text>

      <rect x="134" y="37" width="346" height="42" fill="#fff"/>
      <text x="153" y="56" class="small ink" font-weight="650">Noema</text>
      <text x="153" y="70" class="tiny sub">个人对话</text>
      <line x1="134" y1="79" x2="480" y2="79" class="line"/>
      <text x="153" y="102" class="tiny faint">今天　09:18</text>
      <text x="153" y="131" class="small ink" font-weight="600">你</text>
      <text x="153" y="151" class="body ink">这周 AI 圈有什么值得关注？</text>
      <text x="153" y="171" class="body ink">别只给我一堆标题。</text>
      <text x="153" y="204" class="small ink" font-weight="600">Noema</text>
      <text x="153" y="225" class="body ink">我现在不能联网核对本周消息。可以先</text>
      <text x="153" y="245" class="body ink">帮你搭一个判断框架；你贴来几条来源，</text>
      <text x="153" y="265" class="body ink">我再一起筛选影响和可信度。</text>
      <line x1="153" y1="281" x2="458" y2="281" class="line"/>
      <text x="153" y="300" class="tiny accent">没有启动检索，也没有虚构引用。</text>
      <text x="153" y="345" class="tiny sub">若将来接入检索：结论和来源仍回到这段对话。</text>
      <text x="153" y="362" class="tiny sub">除非主题跨日且需要独立上下文，否则不开新聊。</text>
      <rect x="148" y="543" width="320" height="76" fill="#fafbf8" stroke="#cbd1cc"/>
      <text x="162" y="566" class="small sub">给 Noema 发消息…</text>
      <line x1="148" y1="585" x2="468" y2="585" class="line"/>
      <text x="162" y="604" class="tiny faint">Enter 发送　·　Shift + Enter 换行</text>
      <text x="423" y="604" class="tiny accent">发送 ↗</text>
    </g>

    <!-- Screen 3 -->
    <g transform="translate(1066,153)">
      <text x="0" y="0" class="label accent">03 / 跨日交付</text>
      <text x="0" y="20" class="small sub">主题独立，但始终保留来源与回路</text>
      <rect x="0" y="37" width="480" height="600" fill="#fff" stroke="#cbd1cc"/>
      <rect x="0" y="37" width="134" height="600" fill="#e5e9e3"/>
      <text x="16" y="64" class="ink" font-size="13" font-weight="700" letter-spacing=".06em">NOEMA</text>
      <line x1="15" y1="79" x2="119" y2="79" class="line"/>
      <text x="16" y="103" class="tiny sub">查找对话　⌘K</text>
      <line x1="15" y1="114" x2="119" y2="114" class="line"/>
      <rect x="9" y="125" width="116" height="36" fill="#fff"/>
      <text x="18" y="140" class="small ink">Noema</text>
      <text x="18" y="153" class="tiny sub">主聊</text>
      <rect x="9" y="165" width="116" height="42" fill="#d8e0da"/>
      <rect x="9" y="165" width="2" height="42" fill="#a13b2b"/>
      <text x="18" y="181" class="small ink" font-weight="650">价格跟踪</text>
      <text x="18" y="195" class="tiny sub">↳ 来自主聊 · 昨天</text>
      <text x="18" y="231" class="small ink">周末安排</text>
      <text x="18" y="244" class="tiny sub">周一</text>
      <line x1="15" y1="586" x2="119" y2="586" class="line"/>
      <text x="17" y="608" class="tiny sub">连接与设置</text>

      <rect x="134" y="37" width="346" height="42" fill="#fff"/>
      <text x="151" y="56" class="small ink" font-weight="650">价格跟踪</text>
      <text x="151" y="70" class="tiny sub">‹ 返回 Noema · 来源消息</text>
      <line x1="134" y1="79" x2="480" y2="79" class="line"/>
      <rect x="151" y="91" width="312" height="53" fill="#f1f3ef"/>
      <text x="161" y="107" class="tiny sub">来源原话　·　Noema 主聊 · 昨天 14:03</text>
      <text x="161" y="124" class="small ink">“我想长期跟踪几家 AI 平台的价格……”</text>
      <text x="151" y="170" class="tiny faint">今天　10:20</text>
      <text x="151" y="196" class="small ink" font-weight="600">Noema</text>
      <text x="151" y="216" class="small ink">先把平台、价格类型和更新频率列清楚。</text>
      <text x="151" y="234" class="small ink">真正改文件前，需要你选择工作区并确认范围。</text>
      <line x1="151" y1="249" x2="462" y2="249" class="line"/>
      <text x="151" y="269" class="tiny sub">项目工作 · 尚未开始</text>
      <text x="151" y="287" class="tiny ink">选择工作区后才启动 DSH；不会因为聊到工具</text>
      <text x="151" y="302" class="tiny ink">就开始运行。执行、停止与文件核验均留痕。</text>
      <rect x="151" y="322" width="125" height="24" fill="#a13b2b"/>
      <text x="163" y="338" fill="#fff" class="tiny">选择工作区</text>
      <text x="151" y="379" class="tiny sub">真实开始后：紧邻此请求显示执行者、状态和结果。</text>
      <text x="151" y="396" class="tiny sub">展开查看范围/核验；交付后从来源消息返回主聊。</text>
      <rect x="148" y="543" width="320" height="76" fill="#fafbf8" stroke="#cbd1cc"/>
      <text x="162" y="566" class="small sub">继续讨论这个主题…</text>
      <line x1="148" y1="585" x2="468" y2="585" class="line"/>
      <text x="162" y="604" class="tiny faint">独立上下文　·　来源可返回</text>
      <text x="423" y="604" class="tiny accent">发送 ↗</text>
    </g>

    <line x1="54" y1="827" x2="1546" y2="827" stroke="#c8cec8"/>
    <text x="54" y="855" class="label ink">结构判断</text>
    <text x="54" y="881" class="small ink">主聊承担关系与来源；主题聊只处理真正跨日、需要独立上下文的事情；执行状态只在实际执行后出现。</text>
    <text x="54" y="903" class="small sub">不做固定 agent 目录、常驻工作面板或自动经历消息。主题消息数增加后，再按真实使用决定是否加收藏/归档，而非先堆分类。</text>
    <text x="54" y="949" class="tiny sub">当前实现：主题聊天、来源回链、工作区授权、DSH 项目工作已存在。当前缺口：联网检索与通用多 agent 调度尚未实现。</text>
    <text x="54" y="969" class="tiny sub">这是结构候选，未定品牌美术与完整响应策略；颜色仅为区分层级，不代表最终品牌色。</text>
    <text x="1546" y="1010" text-anchor="end" class="mono faint" font-size="10">NOEMA / CONVERSATION STUDY / 2026.10</text>
  </g>
</svg>
