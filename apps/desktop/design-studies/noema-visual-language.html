const state={theme:'a',scene:'daily',panel:false,nav:innerWidth>600,drafts:{daily:'',work:'',team:''},added:{daily:[],work:[],team:[]},attachments:{daily:[],work:[],team:[]},get files(){return this.attachments[this.scene]},set files(v){this.attachments[this.scene]=v},reviewed:false};

['Noema','10:13','<p>我想先弄清楚店里最麻烦的那一次报名：是人报了没来、临时改人数，还是付款和名单对不上？这些会决定第一版先补哪里。</p>'],
['你','10:14','<p>付款和名单对不上最常见。每场最多 12 人，每月四场。有时还要退款。店员只有两个人，不想再多学一套后台。</p>'],
['Noema','10:26','<h2>第一版，先把一场活动管清楚。</h2><p class="lead">重点是让同一份记录同时说明“谁来了、付没付、还能不能退”。不需要先做成一个完整的书店经营系统。</p><div class="work-note"><span class="work-dot"></span><div><strong>周末书店</strong><br><span>觅知与折线完成初步梳理 · 方案待你判断</span></div><button data-scene="team">查看团队 ↗</button></div><h3><span class="num">01</span>顾客只需要完成这三步</h3><p>选活动、留联系方式、完成付款。报名后拿到一条可回访的记录，能看见时间地点、报名人数以及取消方式。</p><table class="data-table"><thead><tr><th>关键环节</th><th>第一版怎么处理</th><th>为什么保留</th></tr></thead><tbody><tr><td><strong>名额</strong></td><td>按场次限制，付款成功后确认；支付中短时占位。</td><td>避免超卖与重复确认。</td></tr><tr><td><strong>退款</strong></td><td>先明确退款规则，支持店员手动审核。</td><td>低频场次可保持简单。</td></tr><tr><td><strong>现场核对</strong></td><td>店员看本场名单，按姓名或手机尾号查找。</td><td>不必先上专用核销设备。</td></tr></tbody></table><h3><span class="num">02</span>两位店员只维护同一份名单</h3><p>后台首页直接显示最近一场活动。付款、取消和退款留下状态与来源，店员不再靠聊天记录拼名单。活动设置从上一场复制，修改时间和人数即可。</p><h3><span class="num">03</span>现在还不必决定的部分</h3><p>会员积分、内容社区、复杂营销和跨店管理都可以以后再看。支付渠道能否开通、资金进入谁的账户，需要店主核实，当前方案不假定已经具备。</p><div class="review-block" id="review"><div class="review-label">需要你的判断</div><h3>第一版是否接受“退款由店员审核”？</h3><p>这个选择会影响规则和实现范围。确认之前，团队继续整理活动页面与名单结构，暂不接入支付。</p><textarea id="review-input" placeholder="说说你的判断，也可以提出其他顾虑…" aria-label="评审反馈"></textarea><div class="review-actions"><button class="solidbtn" data-act="review">把反馈交给 Noema</button><button class="plainbtn" data-act="context">查看方案依据</button></div></div>','report']

['done','报名与退款问题梳理','觅知 · 依据：场景清单'],
['done','第一版范围及暂缓项','Noema · 用户讨论记录'],
['done','名额与订单状态约定','折线 · 状态草图']
]],
['02','报名与店员名单','进行中',[
['done','活动页与报名路径','棱镜 · 初稿已评阅'],
['active','店员本场名单交互','棱镜 · 进行中'],
['pending','预约记录与名额锁定','折线 · 依赖交互确认']
]],
['03','支付、取消与交付','等待前置',[
['pending','支付渠道与账户核实','觅知 · 等待店主信息'],
['pending','付款与退款状态接入','折线 · 依赖退款决策'],
['pending','完整报名链路验收','Noema · 依赖实现完成']
]]
];
function renderPanel(){
const d=$('#detail');d.hidden=!state.panel;if(!state.panel)return;
let title,body;
if(state.scene==='team'){
title='共享计划';body='<div class="detail-eyebrow">周末书店 / PLAN · REV 3</div><h2>让一场活动<br>从报名走到现场。</h2><p>以付款、名额与名单一致为交付目标。当前不连接真实支付。</p><div class="progress-line"><span></span></div><div class="progress-label"><span>已验收工作项</span><b>4 / 9 · 44%</b></div>'+phases.map((p,i)=>'<details class="phase" '+(i===1?'open':'')+'><summary><span class="phase-num">'+p[0]+'</span>'+p[1]+'<span class="phase-status">'+p[2]+'</span></summary><div class="phase-outcome">'+['退出条件：第一版范围及规则经用户确认。','退出条件：顾客与店员的核心路径可操作并通过评阅。','退出条件：支付状态一致，失败及取消路径得到核验。'][i]+'</div>'+p[3].map(t=>'<div class="task '+t[0]+'"><span class="task-status"></span><div><button data-task="'+esc(t[1])+'">'+t[1]+'</button><small>'+t[2]+'</small></div></div>').join('')+'</details>').join('');
}else if(state.scene==='work'){
title='依据与进展';body='<div class="detail-eyebrow">关联项目</div><h2>周末书店</h2><p>当前在预研究与方案阶段。以下为视觉样本，不代表真实调研结论。</p><button class="inline-action" data-scene="team">进入团队对话 '+icon('chevron')+'</button><h3 style="font-size:11px;margin-top:25px">参与成员</h3>'+['觅知','棱镜','折线'].map(n=>'<div class="detail-person">'+avatar(n)+'<div>'+n+'<small>'+people[n][2]+'</small></div><span class="presence">'+(n==='觅知'?'本轮已交付':'细化中')+'</span></div>').join('')+'<h3 style="font-size:11px;margin-top:25px">本轮材料</h3><button class="references" data-material="报名与退款场景清单">报名与退款场景清单<small>觅知 · 10:19</small></button><button class="references" data-material="名额与订单状态草图">名额与订单状态草图<small>折线 · 10:23</small></button>';
}else{
title='本次分享';body='<span class="sample-tag">自主活动 · 概念呈现</span><div class="detail-eyebrow">排版练习 / 04</div><h2>绕一点路</h2><p>这张图是样稿内的原创矢量素材，用于查看作品在对话中的呈现。</p><div style="margin:20px 0">'+art+'</div><h3 style="font-size:11px">活动许可</h3><p>示例：允许本次排版探索，额度上限 ¥2.00，可随时暂停。</p><p>本样稿没有模型调用，实际模型费用为 ¥0；正式产品的预算计量与约束尚需单独实现和验收。</p><button class="plainbtn" data-act="pause-exploration" style="padding-left:0">暂停活动（演示）</button>';
}
d.innerHTML='<div class="detail-header"><span>'+title+'</span><button class="iconbtn" data-act="close-panel" aria-label="收起详情">'+icon('close')+'</button></div><div class="detail-scroll">'+body+'</div>';
}
function scene(next){state.drafts[state.scene]=$('#draft').value;state.scene=next;state.panel=next!=='daily';render();$('#messages').scrollTop=0;if(innerWidth<=600){state.nav=false;$('.sidebar').classList.add('hidden');state.panel=false;renderPanel();}}
function toast(s){$('#toast').textContent=s;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',3000);}
function modal(title,body){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;$('#modal').showModal();renderIcons($('#modal'));}
function syncSend(){$('[data-act="send"]').disabled=!$('#draft').value.trim()&&!state.files.length;}
function renderFiles(){$('#attachments').innerHTML=state.files.map((f,i)=>'<span class="filechip">'+esc(f.name)+'<button data-remove-file="'+i+'" aria-label="移除附件 '+esc(f.name)+'">×</button></span>').join('');}
const notes='<h2>同一份内容，两种视觉组织。</h2><p>本轮评审视觉语言、阅读密度与交互细节。所有对话、成员身份、计划和状态均为演示数据；不会调用模型。自主创作情境属于未来能力概念。</p><h3>A · 版式主导</h3><p>连续稿面、边栏署名与清晰的文字尺度。正文占主位，工作进展和材料按需展开。借用编辑设计的阅读节奏，避免把应用做成报纸或欢迎海报。风险是理性、疏离，需由日常短句检验。</p><h3>B · 消息交互主导</h3><p>消息组、可辨认的参与者、紧凑工具和不同内容的承载方式。短聊更聚拢，长答仍展开为阅读稿面。风险是通用 messenger 感，需检验品牌形状、比例与色彩是否形成自己的整体。</p><h3>参照与继承</h3><div class="source"><strong><a href="https://www.editorialnew.com/" target="_blank" rel="noreferrer">Editorial New / Locomotive</a></strong><p>实际查看入口、字体试验区与可编辑样本。借鉴字体可成为内容、不同尺度可以共存；不使用其字体资源、不照搬复古广告与巨幅展示。</p></div><div class="source"><strong><a href="https://linear.app/now/behind-the-latest-design-refresh" target="_blank" rel="noreferrer">Linear / 2026 界面刷新</a></strong><p>参考官方界面对照与解释，校准导航视觉权重、紧凑操作、边界层级。未把官方文章等同完整应用实测；不把项目管理外观直接复制为 Noema。</p></div><div class="source"><strong><a href="https://teenage.engineering/products/ep-133" target="_blank" rel="noreferrer">teenage engineering / EP–133</a></strong><p>观察产品实图与控制标记。借鉴高密度下的精确分组、少量鲜明颜色和图形尺度；不把硬件按钮或拟物装饰移植到聊天里。</p></div><h3>可以操作</h3><p>切换方向与情境、拉伸/收起侧栏、筛选成员与项目、搜索消息、展开共享计划、查看作品与资料、输入 @、本地发送、添加附件及提交演示反馈。输入与发送仅留在当前页面；刷新后重置。</p>';
document.addEventListener('click',async e=>{
const b=e.target.closest('button');if(!b)return;
if(b.dataset.removeFile!==undefined){state.files.splice(Number(b.dataset.removeFile),1);renderFiles();syncSend();return;}
if(b.dataset.themeChoice){const rect=$('#messages').getBoundingClientRect();const items=[...$('#messages').querySelectorAll('.msg')];const index=items.findIndex(x=>x.getBoundingClientRect().bottom>rect.top);const anchor=index<0?null:{index,top:items[index].getBoundingClientRect().top-rect.top};state.drafts[state.scene]=$('#draft').value;state.theme=b.dataset.themeChoice;render(anchor);return;}
if(b.dataset.scene){scene(b.dataset.scene);return;}
if(b.dataset.person){modal(b.dataset.person,'<div style="display:flex;gap:13px;align-items:center">'+avatar(b.dataset.person)+'<div>'+b.dataset.person+'<br><small>'+people[b.dataset.person][2]+'</small></div></div><p>成员资料为视觉样本。其身份与项目会话分开，完整私聊界面不在本轮样稿范围内。</p><button class="solidbtn" data-scene="team" onclick="document.querySelector(\'#modal\').close()">查看参与项目</button>');return;}
if(b.dataset.task){modal(b.dataset.task,'<span class="sample-tag">计划工作项 · 视觉样本</span><h2>'+esc(b.dataset.task)+'</h2><p>计划沿用“项目目标 → 阶段 → 团队工作项”的现有结构。每项保留负责人、前置依赖、验收与成果依据；本轮不重新定义计划架构。</p><h3>验收与证据</h3><p>相关路径能在样稿中完成，顾客与店员看到一致状态。演示工作项不代表真实开发进度。</p>');return;}
if(b.dataset.material){modal(b.dataset.material,'<span class="sample-tag">材料预览 · 视觉样本</span><h2>'+esc(b.dataset.material)+'</h2><p>名额、报名与支付应分别保存状态。付款成功后确认报名；支付未完成可保留短时占位。重复通知不能重复确认名额。</p><table class="data-table"><tr><th>订单</th><th>报名</th><th>顾客看到</th></tr><tr><td>支付中</td><td>待确认</td><td>正在核对付款</td></tr><tr><td>已付款</td><td>已确认</td><td>报名成功</td></tr><tr><td>退款中</td><td>取消中</td><td>退款处理中</td></tr></table><p>以上仅为本轮样稿材料，不是正式支付规格。</p>');return;}
const act=b.dataset.act;
if(act==='nav'){state.nav=!state.nav;$('.sidebar').classList.toggle('hidden',!state.nav);}
if(act==='context'){state.panel=!state.panel;renderPanel();}
if(act==='close-panel'){state.panel=false;renderPanel();}
if(act==='notes')modal('设计依据与评审边界',notes);
if(act==='close-modal')$('#modal').close();
if(act==='art')modal('绕一点路 · 原创矢量样本',art+'<p>该素材由本次样稿制作，不是 Noema 自主探索的实测结果。</p>');
if(act==='settings')modal('设置预览','<h2>把控制交还给用户。</h2><p>本轮只展示设置的阅读尺度与操作密度，不连接账户或真实模型。</p><table class="data-table"><tr><td>自主探索</td><td>需明确授权范围与预算</td></tr><tr><td>模型调用</td><td>当前样稿不调用</td></tr><tr><td>信息与数据</td><td>仅保留在当前页面，刷新重置</td></tr></table>');
if(act==='archived')modal('已归档项目','<p>归档后保留项目记录，重新启用时接续原有项目会话。本轮只保留导航入口，没有填入历史项目样本。</p>');
if(act==='attach')$('#file').click();
if(act==='mention'){
if(state.scene!=='team'){toast('当前是与 Noema 的私聊，群聊中可 @ 成员。');return;}
const picker=$('#mention-picker');picker.hidden=!picker.hidden;picker.innerHTML=['所有人','Noema','觅知','棱镜','折线'].map(n=>'<button data-mention="'+n+'">'+(n==='所有人'?'<span class="avatar">全</span>':avatar(n))+n+'</button>').join('');
}
if(b.dataset.mention){$('#draft').value=$('#draft').value.replace(/@[^\s@]*$/,'')+'@'+b.dataset.mention+' ';$('#mention-picker').hidden=true;$('#draft').focus();syncSend();}
if(act==='send'){
const text=$('#draft').value.trim();if(!text&&!state.files.length)return;const message=text+(state.files.length?'\n附件：'+state.files.map(f=>f.name).join('、'):'');
state.added[state.scene].push(message);state.drafts[state.scene]='';state.files=[];render();$('#messages').scrollTop=$('#messages').scrollHeight;$('#draft').focus();toast('已追加到本地视觉样稿，未调用模型。');
}
if(act==='review'){
const input=$('#review-input');if(!input.value.trim()){input.focus();return;}
state.reviewed=true;state.added.work.push(input.value.trim());state.drafts.work='';render();$('#messages').scrollTop=$('#messages').scrollHeight;toast('反馈已在样稿中交给 Noema；未发送给真实团队。');
}
if(act==='go-review'){scene('work');requestAnimationFrame(()=>$('#review').scrollIntoView({block:'center',behavior:'smooth'}));}
if(act==='pause-exploration'){b.textContent='已暂停（演示）';b.disabled=true;toast('演示活动已暂停；没有实际模型进程。');}
if(act==='copy-message'){try{await navigator.clipboard.writeText(b.closest('.body').innerText);toast('已复制消息。');}catch{toast('浏览器未授予剪贴板权限，可直接选择正文复制。');}}
if(act==='reply-message'){const text=b.closest('.body').innerText.split('\n')[0];$('#draft').value='引用：'+text.slice(0,90)+'\n\n';$('#draft').focus();syncSend();}
if(act==='search')openSearch();
});
function openSearch(){modal('搜索全部消息','<div class="search-dialog"><input id="query" placeholder="搜索对话、方案与团队消息…" aria-label="搜索关键词"><div id="search-results"></div></div>');$('#query').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();$('#search-results').innerHTML=q?Object.entries(content).flatMap(([s,items])=>items.filter(x=>x[2].toLowerCase().includes(q)).map(x=>'<button class="search-result" data-scene="'+s+'" onclick="document.querySelector(\'#modal\').close()">'+esc(x[2].replace(/<[^>]+>/g,' ').slice(0,120))+'<small>'+x[0]+' · '+({daily:'日常交谈',work:'专业长答',team:'周末书店'}[s])+'</small></button>')).join('')||'<p>没有找到相符消息。</p>':'<p>搜索覆盖三组视觉样本；左栏搜索只筛选成员与项目。</p>';});$('#query').dispatchEvent(new Event('input'));$('#query').focus();}
$('#scenario').addEventListener('change',e=>scene(e.target.value));
$('#draft').addEventListener('input',e=>{state.drafts[state.scene]=e.target.value;syncSend();if(state.scene==='team'&&/@[^\s@]*$/.test(e.target.value)){$('#mention-picker').hidden=true;$('[data-act="mention"]').click();}else $('#mention-picker').hidden=true;});
$('#draft').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('[data-act="send"]').click();}});
$('#file').addEventListener('change',e=>{state.files=[...state.files,...e.target.files];renderFiles();syncSend();e.target.value='';});
$('#nav-filter').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.nav-row').forEach(row=>row.hidden=!row.innerText.toLowerCase().includes(q));});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close();}});
const resize=$('.resizer');let dragging=false;
resize.addEventListener('pointerdown',e=>{dragging=true;resize.setPointerCapture(e.pointerId);resize.classList.add('dragging');});
resize.addEventListener('pointermove',e=>{if(!dragging)return;const x=e.clientX;if(x<70){state.nav=false;$('.sidebar').classList.add('hidden');return;}state.nav=true;$('.sidebar').classList.remove('hidden');$('.sidebar').style.setProperty('--nav-width',Math.max(190,Math.min(340,x))+'px');});
resize.addEventListener('pointerup',()=>{dragging=false;resize.classList.remove('dragging');});
resize.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const w=$('.sidebar').getBoundingClientRect().width+(e.key==='ArrowLeft'?-10:10);$('.sidebar').style.setProperty('--nav-width',Math.max(190,Math.min(340,w))+'px');}});
render();
</script>
</body></html>
