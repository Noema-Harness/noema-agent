name: 缺陷
description: 报告 Noema 的可复现错误
title: "[缺陷] "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与环境
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 删除密钥、私人内容和不必要的个人数据后再附上。
