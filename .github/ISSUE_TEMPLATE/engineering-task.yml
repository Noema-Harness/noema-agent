name: 工程任务
description: 有明确结果与验收条件的实现、维护或基础设施工作
title: "[工程] "
labels: ["type:engineering"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: 要改变什么，为什么
      description: 说明当前问题/用户结果，不要只写解决方案名称。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 已知约束、依据与依赖
      description: 区分确认事实、已有决定、暂定假设和 blocked-by Issue。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 写出可以观察或测试的结果；包括失败路径或回滚要求（如适用）。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证策略
      description: 说明要运行什么检查或人工验收什么；未验证项也要记录。
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 范围、非目标与数据/权限影响
      description: 无额外数据或权限影响时写“暂无”。
    validations:
      required: true
