name: Desktop checks

# PR 跑完整检查；main 推送与手动派发跑同一套（里程碑与 CI 同源）。
# 2026-11-16 曾因私有仓库额度用尽让所有 job 4s 失败；仓库已公开，标准 runner 免费。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    # PR 上把图漂移降为提示：图是维护者资产，协作者不该为了过门而等待重出图。
    env:
      NOEMA_FIGURE_SOFT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check

  # 可移植性门：同一套测试在 Ubuntu 上也要过。只在 Windows 才能验证的用例在用例外处显式标注
  # （`apps/desktop/test/support/platform-cases.mjs` 的 `windowsOnly`），跳过原因会出现在日志里；
  # 其余失败一律是真回归，和 `verify` 一起构成 PR 合并门。
  portable:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Portable tests (Windows-only cases tagged in place)
        run: npm test

  collaboration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      # github.actor on pull_request is the last pusher, not the PR author: when a
      # maintainer adds a commit to someone else's branch the gate would flip from
      # fail to pass. Regression sample: PR #155 run 43862079239 (actor=bot, author=bot,
      # collaboration fail) vs run 43868086384 (actor=maintainer, author=bot, collaboration pass).
      - name: Only maintainers can change governance paths
        run: node scripts/collaboration.mjs --actor "${{ github.event.pull_request.user.login || github.actor }}" --base "origin/${{ github.base_ref }}"