name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run package:desktop
      - run: npm run smoke:package
      - run: npm run make:desktop
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch'
        with:
          name: noema-windows-portable-${{ github.sha }}
          path: apps/desktop/out/Noema-win32-x64/
          if-no-files-found: error
          retention-days: 7
