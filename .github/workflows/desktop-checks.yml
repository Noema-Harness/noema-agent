name: Desktop checks

# PR 跑完整检查；main 推送只跑一条十几秒的平台门（平台树不允许未收口 change）。
# 2026-11-16 曾因私有仓库额度用尽让所有 job 4s 失败；仓库已公开，标准 runner 免费。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    # PR 上把架构图漂移降为提示：图是维护者资产，协作者不该为了过门而等待重出图。
    env:
      NOEMA_FIGURE_SOFT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The PR carries its plan and no unconfirmed decisions
        if: github.event_name == 'pull_request'
        run: node scripts/maintenance.mjs range --base "origin/${{ github.base_ref }}"

  # 可移植性报告：在 Linux 上跑同一套测试，先把“只有 Windows 能过”的用例暴露出来。
  # 报告期不拦 PR；用例按平台显式标记后转为 required check（D-20261116-platform-layers 的第②③刀）。
  portable:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Portable tests (report only until Windows-only cases are tagged)
        run: npm test

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: The pull request carries only its own change
        if: github.event_name == 'pull_request'
        run: node scripts/maintenance.mjs platform --base "origin/${{ github.base_ref }}"
      - name: The merged tree carries no unclosed change
        if: github.event_name != 'pull_request'
        run: node scripts/maintenance.mjs platform

  collaboration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      # github.actor on pull_request is the last pusher, not the PR author: when a
      # maintainer adds a commit to someone else's branch the gate would flip from
      # fail to pass. Regression sample: PR #155 run 43862079239 (actor=bot, author=bot,
      # collaboration fail) vs run 43868086384 (actor=maintainer, author=bot, collaboration pass).
      - name: Only maintainers can change governance paths
        run: node scripts/collaboration.mjs --actor "${{ github.event.pull_request.user.login || github.actor }}" --base "origin/${{ github.base_ref }}"
