name: Desktop checks

# PR 跑完整检查；main 推送只跑一条十几秒的平台门（平台树不允许未收口 change）。
# 2026-11-16 曾因私有仓库额度用尽让所有 job 4s 失败；仓库已公开，标准 runner 免费。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The PR carries its plan and no unconfirmed decisions
        if: github.event_name == 'pull_request'
        run: node scripts/maintenance.mjs range --base "origin/${{ github.base_ref }}"

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: The merged tree carries no unclosed change
        run: node scripts/maintenance.mjs platform

  collaboration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Only maintainers can change governance paths
        run: node scripts/collaboration.mjs --actor "${{ github.actor }}" --base "origin/${{ github.base_ref }}"
