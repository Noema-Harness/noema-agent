name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run workspace:test
      - run: npm run check
      - run: npm run e2e:social-agents --workspace noema-desktop
      - name: Inspect desktop processes after social E2E
        if: always()
        shell: pwsh
        run: |
          Get-NetTCPConnection -State Listen -LocalPort 5173 -ErrorAction SilentlyContinue | Select-Object LocalAddress, LocalPort, OwningProcess
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'noema-agent|electron-forge|vite|electron' } | Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-List
      - run: npm run smoke
      - run: npm run package:desktop
      - run: npm run smoke:package
      - run: npm run make:desktop
      - name: Verify Squirrel install, upgrade, and uninstall data retention
        shell: pwsh
        run: npm run smoke:installer --workspace noema-desktop
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch'
        with:
          name: noema-windows-portable-${{ github.sha }}
          path: apps/desktop/out/Noema-win32-x64/
          if-no-files-found: error
          retention-days: 7
