name: Desktop checks

# 只在 PR 与手动触发时跑：main 推送不再触发，节省 Actions 额度（2026-11-16 因额度用尽全部 job 4s 失败）。
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check

  collaboration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Only maintainers can change governance paths
        run: node scripts/collaboration.mjs --actor "${{ github.actor }}" --base "origin/${{ github.base_ref }}"
