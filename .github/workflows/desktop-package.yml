name: Desktop package

# 打包与安装包验证昂贵（Windows runner 约 10 分钟）：只在触及桌面端的 PR 与手动触发时跑。
# 发布前由维护者用 workflow_dispatch 手动跑一次全流程。
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run smoke
      - run: npm run package:desktop
      - run: npm run smoke:package
      - run: npm run make:desktop
      - name: Verify Squirrel install, upgrade, and uninstall data retention
        shell: pwsh
        run: npm run smoke:installer --workspace noema-desktop
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch'
        with:
          name: noema-windows-portable-${{ github.sha }}
          path: apps/desktop/out/Noema-win32-x64/
          if-no-files-found: error
          retention-days: 7
