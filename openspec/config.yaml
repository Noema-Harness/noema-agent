  PRODUCT_CHARTER、ROADMAP、ARCHITECTURE 与核心流程图分别保持方向、阶段、代码导航和逻辑全景，不替代行为规格。
  沿 .codex/workspace.json 选择本项相关材料，不复制完整项目历史；原 GitHub Project 已封存。
rules:
