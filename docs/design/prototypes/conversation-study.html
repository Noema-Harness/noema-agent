<script>
'use strict';
const initialRooms=[
 {id:'noema',name:'Noema',kind:'私聊',subtitle:'私聊',people:['Noema'],messages:[
  {id:'m1',sender:'你',role:'user',time:'14:06',text:'周末想出去走一走，不赶景点。帮我想个轻松一点的安排。',status:'complete'},
  {id:'m2',sender:'Noema',role:'assistant',time:'14:06',text:'先找一段临水的步道，走累了就在附近坐坐。\n\n只确认怎么去、怎么回来，不把下午排满。你想离家近一点，还是愿意坐一会儿车？',status:'complete'},
  {id:'m3',sender:'你',role:'user',time:'14:09',text:'离家近一点，而且想随时改主意。',status:'complete'},
  {id:'m4',sender:'Noema',role:'assistant',time:'14:09',text:'那就先找一个方便抵达的起点。\n\n你从哪里出发？我据此帮你缩小范围。',status:'complete'}
 ]},
 {id:'lin',name:'林止',kind:'私聊',subtitle:'私聊',people:['林止'],messages:[
  {id:'l1',sender:'你',role:'user',time:'13:20',text:'最近读东西总想划线，最后却不记得真正留下了什么。',status:'complete'},
  {id:'l2',sender:'林止',role:'assistant',time:'13:20',text:'或许可以试试读完一段后，把书合上。\n\n不急着概括，只写下还在脑子里的那一句。留下来的未必是最漂亮的话，可能只是让你停了一下的地方。',status:'complete'}
 ]},
 {id:'walk',name:'周末走走',kind:'群聊',subtitle:'Noema、阿遥 · 2 位 agent',people:['Noema','阿遥'],messages:[
  {id:'g1',sender:'你',role:'user',time:'11:10',text:'把散步的想法放在这里。先不用做计划，想到什么再聊。',status:'complete'},
  {id:'g2',sender:'阿遥',role:'assistant',time:'11:10',text:'好。等你想继续的时候，我们再从这里开始。',status:'complete'}
 ]},
 {id:'empty',name:'白榆',kind:'私聊',subtitle:'私聊',people:['白榆'],messages:[]}
];
let rooms=structuredClone(initialRooms),active='noema';
const noemaPortrait=document.querySelector('#portrait-art').innerHTML;
const portraits={
 lin:'<g transform="rotate(-12 180 215)"><path class="underside" d="M62 55h88v210h154v88H62Z" transform="translate(12 12)"/><path class="ribbon" d="M62 55h88v210h154v88H62Z"/><path class="cut" d="m45 296 266-139v36L45 332Z"/></g>',
 walk:'<g transform="rotate(-12 180 215)"><circle class="underside" cx="151" cy="176" r="101"/><circle class="ribbon" cx="139" cy="164" r="101"/><circle class="underside" cx="227" cy="280" r="101"/><circle class="ribbon" cx="215" cy="268" r="101"/><path class="cut" d="m45 296 280-147v36L45 332Z"/></g>',
 empty:'<g transform="rotate(-12 180 215)"><path class="underside" d="M50 65h145c88 0 88 140 0 140 100 0 100 150 0 150H50Z" transform="translate(12 12)"/><path class="ribbon" d="M50 65h145c88 0 88 140 0 140 100 0 100 150 0 150H50Z"/><path class="cut" d="m45 296 266-139v36L45 332Z"/></g>'
};
let drafts={},replyTargets={},targets={},positions={},following={},timers=new Map(),sequence=0;
const $=id=>document.getElementById(id);
const room=()=>rooms.find(item=>item.id===active);
function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function action(label,handler){const b=element('button','text-action',label);b.type='button';b.addEventListener('click',handler);return b}
function announce(text){$('announcer').textContent=text}
function demoTime(){const minutes=(14*60+10+sequence)%1440;return String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0')}
function resizeDraft(){$('draft').style.height='auto';$('draft').style.height=Math.min(160,$('draft').scrollHeight)+'px'}
function renderRooms(){
 const query=$('search').value.trim().toLocaleLowerCase();
 const visible=rooms.filter(item=>(item.name+' '+item.messages.map(m=>m.text).join(' ')).toLocaleLowerCase().includes(query));
 $('room-count').textContent=String(visible.length).padStart(2,'0');$('quick-count').textContent=String(rooms.length).padStart(2,'0');
 $('rooms').replaceChildren();
 for(const item of visible){
  const b=element('button','room');b.type='button';if(item.id===active)b.setAttribute('aria-current','page');
  const top=element('span','room-top');top.append(element('span','room-name',item.name),element('span','room-kind',item.kind));
  const last=item.messages.at(-1);top.append(element('span','room-time',last?last.time:''));
  const preview=element('span','room-description');
  if(drafts[item.id]){preview.append(element('span','draft-label','草稿 · '),document.createTextNode(drafts[item.id].slice(0,64)))}
  else preview.textContent=last?(last.sender+'：'+(last.text||'正在回复…').replace(/\s+/g,' ').slice(0,64)):'还没有消息';
  b.append(top,preview);b.addEventListener('click',()=>selectRoom(item.id));$('rooms').append(b);
 }
 if(!visible.length)$('rooms').append(element('p','index-empty','没有找到这段聊天。\n试试其他名字或内容。'));
}
function renderMessages({restore=false}={}){
 const history=$('history'),previous=history.scrollTop;
 const follow=following[active]!==false;
 const fragment=document.createDocumentFragment();
 if(!room().messages.length){
  const empty=element('div','empty-state');empty.append(element('h2','empty-name','从这里开始。'),element('p','', '不用准备一个完整的问题。\n一句刚刚想到的话，也可以。'));fragment.append(empty);
 }else{
  fragment.append(element('div','day-divider','10 月 21 日 · 对话示意'));
  for(const message of room().messages){
   const node=$('message-template').content.firstElementChild.cloneNode(true);
   node.dataset.messageId=message.id;node.classList.toggle('is-user',message.role==='user');
   node.setAttribute('aria-label',message.sender+'的消息');
   node.querySelector('.sender').textContent=message.sender;node.querySelector('.sender').title=message.sender;
   node.querySelector('time').textContent=message.time;
   const copy=node.querySelector('.message-copy');copy.textContent=message.text;
   copy.classList.toggle('streaming',message.status==='streaming');
   if(message.reply){const quote=node.querySelector('.quote');quote.hidden=false;quote.append(element('b','',message.reply.sender),document.createTextNode(message.reply.text))}
   const state=node.querySelector('.message-state');
   if(message.status==='failed'||message.status==='interrupted'){
    state.hidden=false;state.classList.toggle('is-error',message.status==='failed');
    state.append(document.createTextNode(message.status==='failed'?'这次回复中断了，已有内容保留。':'已停止，已有内容保留。'),action('重新回复',()=>startReply(active,message)));
   }
   if(message.status==='complete'){
    const actions=node.querySelector('.message-actions');
    actions.append(action('回复',()=>{replyTargets[active]={id:message.id,sender:message.sender,text:message.text};syncComposer();$('draft').focus()}),action('复制',async()=>{try{await navigator.clipboard.writeText(message.text);announce('消息已复制')}catch{announce('复制不可用，请选择消息文字复制')}}));
   }
   fragment.append(node);
  }
 }
 $('messages').replaceChildren(fragment);
 if(restore){history.scrollTop=positions[active]??history.scrollHeight}
 else history.scrollTop=follow?history.scrollHeight:previous;
 $('new-messages').hidden=follow||history.scrollHeight-history.clientHeight-history.scrollTop<32;
}
function syncComposer(){
 const running=timers.has(active);
 $('send').disabled=!running&&!$('draft').value.trim();
 $('send').classList.toggle('is-stop',running);
 $('send').setAttribute('aria-label',running?'停止本轮回复':'发送消息');
 $('send').innerHTML=running?'<span class="stop-shape" aria-hidden="true"></span>':'<svg aria-hidden="true"><use href="#icon-send"/></svg>';
 const reply=replyTargets[active];$('replying').hidden=!reply;
 if(reply){$('replying-text').replaceChildren(element('strong','','回复 '+reply.sender),document.createTextNode(reply.text))}
 $('identity').dataset.streaming=String(running);$('identity-state').textContent=running?'正在模拟回复…':'';
 $('draft-status').textContent=running?'正在模拟回复…':$('draft').value?'草稿仅在本页暂存':'仅本页合成对话';
}
function renderHeader(){
 $('room-title').textContent=room().name;$('room-subtitle').textContent=room().subtitle;
 $('portrait-art').innerHTML=portraits[active]||noemaPortrait;$('portrait-name').textContent=room().name;$('small-identity').innerHTML=portraits[active]||noemaPortrait;$('portrait-kind').textContent=room().kind==='群聊'?'一起交谈':'个人 agent';$('draft').placeholder='写给 '+(targets[active]||room().people[0])+'…';
 $('draft').setAttribute('aria-label','给'+(targets[active]||room().people[0])+'写消息');
 $('recipient').hidden=room().kind!=='群聊';
 $('target').replaceChildren(...room().people.map(name=>{const option=element('option','',name);option.value=name;return option}));
 $('target').value=targets[active]||room().people[0];
 $('details-content').replaceChildren(element('p','',room().kind+' · '+room().name),...room().people.map(name=>{const p=element('div','person',name);p.append(element('small','','agent · 合成样例身份'));return p}),element('p','','此页是视觉与交互研究稿，不会连接模型或读取应用数据。'));
}
function setDetailsInert(value){document.querySelector('.sidebar').inert=value;document.querySelector('.masthead').inert=value;document.querySelector('.identity').inert=value;document.querySelector('.review-bar').inert=value;for(const child of document.querySelector('.conversation').children){if(child.id!=='details-panel')child.inert=value}}
let detailsOrigin='details';
function closeDetails(){$('details-panel').hidden=true;$('details').setAttribute('aria-expanded','false');setDetailsInert(false)}
function selectRoom(id){
 positions[active]=$('history').scrollTop;drafts[active]=$('draft').value;
 active=id;closeDetails();$('notice').hidden=true;
 closeList();$('draft').value=drafts[id]||'';
 renderRooms();renderHeader();renderMessages({restore:true});resizeDraft();syncComposer();$('draft').focus();
}
function startReply(roomId,message){
 if(timers.has(roomId))return;
 message.text='';message.status='streaming';following[roomId]=true;
 const text=Array.from('（模拟回复）收到这条消息。这页只演示阅读、输入、切换聊天，以及停止和重试的状态反馈；不会调用模型。你可以在回复途中切到另一段聊天，再回来继续。');
 let offset=0;
 const handle=setInterval(()=>{
  offset+=4;message.text=text.slice(0,offset).join('');
  if(offset>=text.length){message.status='complete';clearInterval(handle);timers.delete(roomId);announce(message.sender+'的模拟回复已完成')}
  if(active===roomId){renderMessages();syncComposer()}if(message.status==='complete')renderRooms();
 },65);
 timers.set(roomId,{handle,message});
 if(active===roomId){renderMessages();syncComposer()}
}
function stopReply(){
 const run=timers.get(active);if(!run)return;
 clearInterval(run.handle);run.message.status='interrupted';if(!run.message.text)run.message.text='';timers.delete(active);renderMessages();syncComposer();announce('已停止模拟回复');
}
function send(){
 if(timers.has(active)){stopReply();return}
 const text=$('draft').value.trim();if(!text)return;
 const current=room(),roomId=active,sender=targets[active]||current.people[0];
 const message={id:'u'+(++sequence),role:'user',sender:'你',time:demoTime(),text,status:'complete',reply:replyTargets[roomId]||null};
 current.messages.push(message);
 drafts[roomId]='';replyTargets[roomId]=null;$('draft').value='';resizeDraft();following[roomId]=true;
 const reply={id:'a'+(++sequence),role:'assistant',sender,time:demoTime(),text:'',status:'streaming'};current.messages.push(reply);
 renderMessages();renderRooms();syncComposer();startReply(roomId,reply);$('draft').focus();
}
$('composer').addEventListener('submit',event=>{event.preventDefault();send()});
$('draft').addEventListener('input',()=>{drafts[active]=$('draft').value;resizeDraft();syncComposer();renderRooms()});
$('draft').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&event.keyCode!==229){event.preventDefault();if(!timers.has(active))send()}});
$('search').addEventListener('input',renderRooms);
$('target').addEventListener('change',()=>{targets[active]=$('target').value;renderHeader()});
$('cancel-reply').addEventListener('click',()=>{replyTargets[active]=null;syncComposer();$('draft').focus()});
function openList(){$('workspace').dataset.view='list';$('back').setAttribute('aria-expanded','true');document.querySelector('.conversation').inert=true;document.querySelector('.identity').inert=true;document.querySelector('.masthead').inert=true;document.querySelector('.review-bar').inert=true;$('search').focus()}
function closeList(){$('workspace').dataset.view='chat';$('back').setAttribute('aria-expanded','false');document.querySelector('.conversation').inert=false;document.querySelector('.identity').inert=false;document.querySelector('.masthead').inert=false;document.querySelector('.review-bar').inert=false}
$('back').addEventListener('click',openList);
$('close-list').addEventListener('click',()=>{closeList();$('back').focus()});
$('portrait-details').addEventListener('click',()=>{$('details').click();detailsOrigin='portrait-details'});
$('details').addEventListener('click',()=>{detailsOrigin='details';$('details-panel').hidden=false;$('details').setAttribute('aria-expanded','true');setDetailsInert(true);$('close-details').focus()});
$('details-panel').addEventListener('keydown',event=>{if(event.key==='Tab'){event.preventDefault();$('close-details').focus()}});
$('close-details').addEventListener('click',()=>{closeDetails();$(detailsOrigin).focus()});
$('new-messages').addEventListener('click',()=>{following[active]=true;$('history').scrollTop=$('history').scrollHeight;$('new-messages').hidden=true});
$('history').addEventListener('scroll',()=>{following[active]=$('history').scrollHeight-$('history').clientHeight-$('history').scrollTop<32;$('new-messages').hidden=following[active]});
$('narrow').addEventListener('click',()=>{const narrow=$('stage').classList.toggle('is-narrow');$('narrow').setAttribute('aria-pressed',String(narrow))});
$('failure').addEventListener('click',()=>{
 if(timers.has(active))stopReply();
 const failed={id:'f'+(++sequence),role:'assistant',sender:targets[active]||room().people[0],time:demoTime(),text:'可以从一个不必赶时间的起点开始。',status:'failed'};
 room().messages.push(failed);following[active]=true;renderMessages();renderRooms();announce('已展示合成失败状态，可以重新回复');
});
$('reset').addEventListener('click',()=>{
 for(const run of timers.values())clearInterval(run.handle);timers.clear();
 rooms=structuredClone(initialRooms);drafts={};replyTargets={};targets={};positions={};following={};active='noema';$('search').value='';$('draft').value='';closeList();closeDetails();renderRooms();renderHeader();renderMessages();resizeDraft();syncComposer();announce('样稿已重置，页面内输入已清空');
});
document.querySelector('.sidebar').addEventListener('keydown',event=>{
 if(event.key!=='Tab')return;
 const all=Array.from(document.querySelector('.sidebar').querySelectorAll('button,input')).filter(node=>!node.disabled);
 const first=all[0],last=all.at(-1);
 if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
 else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
});
document.addEventListener('keydown',event=>{
 if(event.isComposing)return;
 if(!$('details-panel').hidden&&event.key!=='Escape')return;
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openList()}
 if(event.key==='Escape'){if($('workspace').dataset.view==='list'){closeList();$('back').focus();return}if(!$('details-panel').hidden){closeDetails();$(detailsOrigin).focus()}else{replyTargets[active]=null;syncComposer();$('draft').focus()}}
 if(event.altKey&&(event.key==='ArrowUp'||event.key==='ArrowDown')){event.preventDefault();const index=rooms.findIndex(r=>r.id===active),next=(index+(event.key==='ArrowDown'?1:-1)+rooms.length)%rooms.length;selectRoom(rooms[next].id)}
});
window.addEventListener('pagehide',()=>{for(const run of timers.values())clearInterval(run.handle)});
renderRooms();renderHeader();renderMessages();syncComposer();
</script>
</body>
</html>
