<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Noema · 聊天方向预览</title>
  <style>
    * {
      box-sizing: border-box;
    }
    :root {
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      color: #242b35;
      background: #e7e9ec;
      font-synthesis: none;
    }
    body {
      margin: 0;
    }
    button,
    textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    button:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #496eb9;
      outline-offset: 3px;
    }
    button {
      border: 0;
      background: none;
      color: inherit;
    }
    svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }
    .review {
      max-width: 1400px;
      margin: auto;
      padding: 21px 30px 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
    }
    .review h1 {
      font-size: 17px;
      margin: 0 0 5px;
      font-weight: 600;
    }
    .review p {
      font-size: 12px;
      color: #57616e;
      margin: 0;
    }
    .review-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .review button {
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 12px;
      background: #f5f6f7;
      border: 1px solid #cdd2d9;
    }
    .review button[aria-pressed="true"] {
      background: #24374e;
      color: white;
      border-color: #24374e;
    }
    .frame {
      --accent: #264e80;
      --soft: #e8eef6;
      --paper: #fcfcfd;
      --muted: #697480;
      width: calc(100% - 60px);
      max-width: 1340px;
      height: 760px;
      max-height: calc(100dvh - 172px);
      min-height: 500px;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid #cbd0d7;
      border-radius: 10px;
      box-shadow: 0 14px 45px #26324310;
      overflow: hidden;
      display: grid;
      grid-template-columns: 70px 285px minmax(0, 1fr);
      position: relative;
    }
    .rail {
      border-right: 1px solid #e1e5ea;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      flex-direction: column;
      padding: 21px 12px;
      gap: 21px;
    }
    .wordmark {
      font-size: 26px;
      letter-spacing: -4px;
      font-weight: 650;
      color: var(--accent);
      margin: 0 4px 22px 0;
      line-height: 1;
    }
    .nav-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #657180;
    }
    .nav-button.active {
      background: var(--soft);
      color: var(--accent);
    }
    .rail-bottom {
      margin-top: auto;
    }
    .rooms {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e3e6eb;
      background: #f9fafc;
      min-height: 0;
      min-width: 0;
    }
    .rooms-head {
      height: 84px;
      flex: none;
      padding: 24px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .rooms-head h2 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.2px;
    }
    .icon-button {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: #5e6c7b;
    }
    .icon-button:hover,
    .nav-button:hover {
      background: #e9edf2;
    }
    .find {
      margin: 0 17px 24px;
      background: #eef1f5;
      border-radius: 6px;
      color: #6b7582;
      text-align: left;
      font-size: 12px;
      padding: 10px 11px;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .find svg {
      width: 16px;
      height: 16px;
    }
    .find kbd {
      margin-left: auto;
      font-size: 10px;
      color: #818a95;
      font-family: inherit;
    }
    .section-label {
      font-size: 10px;
      color: #6d7887;
      letter-spacing: 1px;
      margin: 0 22px 12px;
    }
    .room-list {
      overflow-y: auto;
      padding: 0 8px;
    }
    .room {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      width: 100%;
      padding: 15px 12px;
      border-radius: 7px;
      margin-bottom: 3px;
    }
    .room.active {
      background: #e7edf6;
    }
    .avatar {
      height: 40px;
      width: 40px;
      flex: none;
      border-radius: 13px;
      background: #ece6da;
      color: #655c4d;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 17px;
    }
    .avatar.core {
      background: #dce6f4;
      color: #264e80;
      font-family: Georgia, serif;
      font-size: 24px;
      font-weight: 400;
    }
    .avatar.group {
      background: #e2e8e3;
      color: #4d6754;
      font-size: 15px;
    }
    .room-content {
      flex: 1;
      min-width: 0;
    }
    .room-line {
      display: flex;
      gap: 5px;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .room-name {
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .time {
      font-size: 10px;
      color: #697480;
      margin-left: auto;
      flex: none;
    }
    .preview {
      font-size: 12px;
      color: #687583;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }
    .private-note {
      margin: auto 21px 24px;
      padding-top: 20px;
      font-size: 11px;
      color: #73808d;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .private-note svg {
      width: 13px;
      height: 13px;
    }
    .chat {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }
    .chat-head {
      height: 84px;
      flex: none;
      border-bottom: 1px solid #e9ecf0;
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .identity {
      min-width: 0;
    }
    .identity h2 {
      font-size: 16px;
      line-height: 1.4;
      margin: 0 0 4px;
      font-weight: 600;
    }
    .identity p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }
    .head-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .mobile-back {
      display: none;
    }
    .thread {
      flex: 1;
      overflow-y: auto;
      padding: 23px 38px 30px;
      scroll-behavior: auto;
    }
    .day {
      font-size: 10px;
      color: #77828d;
      text-align: center;
      letter-spacing: 0.6px;
      margin: 1px 0 31px;
    }
    .message {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 26px;
    }
    .message .avatar {
      width: 30px;
      height: 30px;
      font-size: 18px;
      border-radius: 10px;
      margin-top: 2px;
    }
    .message.user {
      justify-content: flex-end;
      margin-bottom: 27px;
    }
    .message.user .avatar {
      display: none;
    }
    .message-body {
      max-width: 510px;
      min-width: 0;
    }
    .message-name {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #5d6b7c;
      margin-bottom: 8px;
    }
    .bubble {
      font-size: 14px;
      line-height: 1.85;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .message.user .bubble {
      background: #edf0f4;
      padding: 12px 17px;
      border-radius: 13px 3px 13px 13px;
      color: #2c3845;
      max-width: 410px;
    }
    .message-time {
      font-size: 9px;
      color: #7b8592;
      margin-top: 8px;
    }
    .message.user .message-time {
      text-align: right;
    }
    .composer-wrap {
      padding: 0 32px 22px;
      flex: none;
    }
    .composer {
      border: 1px solid #d8dee6;
      border-radius: 10px;
      background: white;
      overflow: hidden;
    }
    .composer textarea {
      display: block;
      width: 100%;
      border: 0;
      background: none;
      resize: none;
      min-height: 72px;
      max-height: 120px;
      padding: 15px 17px 9px;
      font-size: 13px;
      color: #26313d;
      line-height: 1.6;
      outline-offset: -3px;
    }
    .composer-tools {
      display: flex;
      align-items: center;
      padding: 4px 10px 10px;
      gap: 3px;
    }
    .hint {
      margin-left: auto;
      font-size: 10px;
      color: #7b8490;
    }
    .send {
      background: var(--accent);
      color: white;
      margin-left: 12px;
      padding: 8px 13px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
    }
    .send svg {
      width: 15px;
      height: 15px;
    }
    .send:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .composer-note {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 10px;
      color: #6d7885;
    }
    .context {
      font-size: 10px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .context svg {
      width: 12px;
      height: 12px;
    }
    .failure {
      border-left: 2px solid #ad684b;
      padding: 4px 0 4px 13px;
      margin-top: 15px;
      font-size: 12px;
      line-height: 1.8;
      color: #6e5246;
    }
    .failure button {
      padding: 0;
      color: #84442d;
      text-decoration: underline;
      text-underline-offset: 3px;
      margin-top: 7px;
      font-size: 11px;
    }
    .review-note {
      margin: 15px auto 24px;
      max-width: 1340px;
      width: calc(100% - 60px);
      font-size: 12px;
      line-height: 1.7;
      color: #4d5967;
    }
    .review-note strong {
      font-weight: 600;
    }
    .toast {
      position: absolute;
      left: 50%;
      bottom: 185px;
      transform: translateX(-50%);
      max-width: 80%;
      background: #26364b;
      color: #fff;
      font-size: 12px;
      padding: 10px 15px;
      border-radius: 7px;
      z-index: 4;
    }
    .toast:empty {
      display: none;
    }
    .detail {
      position: absolute;
      right: 16px;
      top: 78px;
      width: 270px;
      padding: 24px;
      background: white;
      border: 1px solid #dbe0e7;
      border-radius: 9px;
      box-shadow: 0 10px 30px #182f4b18;
      z-index: 3;
    }
    .detail h3 {
      font-size: 17px;
      margin: 0 0 8px;
    }
    .detail p {
      font-size: 12px;
      line-height: 1.8;
      color: #677381;
    }
    .detail button {
      font-size: 11px;
      color: var(--accent);
      padding: 4px 0;
    }
    .detail[hidden] {
      display: none;
    }
    .frame.quiet {
      --accent: #8d4d36;
      --soft: #f4e8e1;
      --paper: #faf8f4;
      --muted: #7e746a;
      grid-template-columns: 78px minmax(0, 1fr);
    }
    .quiet .rail {
      background: #f2eee7;
      border-color: #e5dfd6;
    }
    .quiet .rooms {
      display: none;
    }
    .quiet.rooms-open {
      grid-template-columns: 78px 255px minmax(0, 1fr);
    }
    .quiet.rooms-open .rooms {
      display: flex;
      background: #f6f2ec;
      border-color: #e5dfd6;
    }
    .quiet .rail .wordmark {
      font-family: Georgia, serif;
      font-weight: 400;
      letter-spacing: -2px;
      font-size: 30px;
    }
    .quiet .nav-button.active {
      background: #e9ded2;
      color: #80513c;
    }
    .quiet .room.active {
      background: #ebe2d6;
    }
    .quiet .avatar.core {
      background: #efe3d8;
      color: #8d4d36;
    }
    .quiet .chat-head {
      height: 96px;
      padding: 0 45px;
      border-color: #e6e0d7;
    }
    .quiet .identity h2 {
      font-family: Georgia, "Microsoft YaHei UI", serif;
      font-size: 23px;
      font-weight: 400;
    }
    .quiet .identity p {
      font-size: 10px;
      letter-spacing: 1px;
    }
    .quiet .chat-head > .avatar {
      display: none;
    }
    .quiet .thread {
      padding: 26px max(40px, calc((100% - 650px) / 2)) 22px;
    }
    .quiet .message-body {
      max-width: 560px;
    }
    .quiet .message {
      margin-bottom: 32px;
      gap: 16px;
    }
    .quiet .message .avatar {
      display: none;
    }
    .quiet .message-name {
      color: #8d4d36;
    }
    .quiet .bubble {
      font-size: 15px;
      line-height: 1.95;
    }
    .quiet .message.user .bubble {
      background: transparent;
      border-bottom: 1px solid #ddd5c9;
      border-radius: 0;
      padding: 0 0 12px;
    }
    .quiet .message.user .message-body {
      max-width: 440px;
    }
    .quiet .composer-wrap {
      padding: 0 max(40px, calc((100% - 650px) / 2)) 25px;
    }
    .quiet .composer {
      border-color: #dbd3c8;
      border-radius: 3px;
      background: #fdfbf8;
    }
    .quiet .composer-note {
      color: #7d7369;
    }
    .quiet .day {
      color: #8b8075;
    }
    .quiet .head-actions .icon-button {
      color: #847468;
    }
    .frame.narrow {
      width: 420px;
      height: calc(100dvh - 172px);
      max-height: 760px;
      grid-template-columns: minmax(0, 1fr);
      min-height: 440px;
    }
    .frame.narrow .rail {
      display: none;
    }
    .frame.narrow .rooms {
      display: none;
    }
    .frame.narrow .chat-head {
      height: 73px;
      padding: 0 17px 0 10px;
      gap: 8px;
    }
    .frame.narrow .mobile-back {
      display: grid;
    }
    .frame.narrow .chat-head > .avatar {
      width: 33px;
      height: 33px;
      font-size: 20px;
      border-radius: 10px;
    }
    .frame.narrow .identity h2 {
      font-size: 15px;
    }
    .frame.narrow .identity p {
      font-size: 10px;
    }
    .frame.narrow .head-actions {
      gap: 0;
    }
    .frame.narrow .head-actions .search-action {
      display: none;
    }
    .frame.narrow .thread {
      padding: 23px 19px 22px;
    }
    .frame.narrow .message {
      gap: 10px;
      margin-bottom: 25px;
    }
    .frame.narrow .message-body {
      max-width: 295px;
    }
    .frame.narrow .bubble {
      font-size: 13px;
    }
    .frame.narrow .message.user .bubble {
      max-width: 285px;
      padding: 11px 14px;
    }
    .frame.narrow .composer-wrap {
      padding: 0 15px 17px;
    }
    .frame.narrow .composer textarea {
      min-height: 65px;
    }
    .frame.narrow .hint {
      font-size: 9px;
    }
    .frame.narrow .composer-note {
      font-size: 9px;
    }
    .frame.narrow .context {
      font-size: 9px;
    }
    .frame.narrow .identity p {
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .frame.narrow.rooms-open .rooms {
      position: absolute;
      inset: 0;
      display: flex;
      z-index: 3;
      border: 0;
    }
    .frame.narrow.rooms-open .rooms-head {
      padding-right: 20px;
    }
    .frame.narrow .private-note {
      margin-top: 30px;
    }
    .frame.narrow.quiet .identity h2 {
      font-size: 21px;
    }
    .frame.narrow.quiet .message.user .bubble {
      padding: 0 0 11px;
    }
    .frame.narrow.quiet .chat-head {
      height: 82px;
    }
    .frame.narrow.quiet .thread {
      padding: 24px;
    }
    .frame.narrow.quiet .bubble {
      font-size: 14px;
    }
    .frame.narrow.quiet .message-body {
      max-width: 325px;
    }
    .frame.narrow.quiet .composer-wrap {
      padding: 0 20px 20px;
    }
    .frame.narrow .detail {
      right: 10px;
      top: 70px;
    }
    @media (max-width: 700px) {
      .review {
        padding: 17px;
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }
      .review p {
        line-height: 1.6;
      }
      .review-controls {
        gap: 5px;
      }
      .review button {
        padding: 8px 9px;
      }
      .frame {
        width: calc(100% - 20px);
        height: 790px;
        max-height: none;
        min-height: 600px;
        grid-template-columns: minmax(0, 1fr);
      }
      .review-note {
        width: calc(100% - 34px);
      }
      .frame.narrow {
        width: calc(100% - 20px);
        max-width: 420px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .thread {
        scroll-behavior: auto;
      }
    }
  </style>
  <header class="review">
    <div>
      <h1>Noema · 两种聊天方向</h1>
      <p>合成日常对话 · 交互预览，不连接模型 · 候选方案，尚未定稿</p>
    </div>
    <div class="review-controls">
      <button id="daily" aria-pressed="true">A 日常通信 · 推荐</button
      ><button id="quiet" aria-pressed="false">B 沉浸对话</button
      ><button id="size" aria-pressed="false">窄窗</button
      ><button id="failure" aria-pressed="false">看失败状态</button>
    </div>
  </header>
  <main class="frame" id="frame" aria-label="Noema 界面方向原型">
    <nav class="rail" aria-label="主导航">
      <div class="wordmark" aria-label="Noema">N</div>
      <button class="nav-button active" id="nav-chats" aria-label="打开聊天列表"></button
      ><button class="nav-button" id="nav-contacts" aria-label="联系人示意"></button
      ><button class="nav-button rail-bottom" id="nav-settings" aria-label="设置示意"></button>
    </nav>
    <aside class="rooms" aria-label="聊天列表">
      <div class="rooms-head">
        <h2>聊天</h2>
        <button class="icon-button" id="new-chat" aria-label="新聊天示意"></button>
      </div>
      <button class="find" id="find-chat">
        <span id="find-icon"></span><span>找一段聊天</span><kbd>Ctrl K</kbd>
      </button>
      <p class="section-label">最近</p>
      <div class="room-list" id="room-list"></div>
      <p class="private-note"><span id="local-icon"></span>聊天记录保存在这台设备</p>
    </aside>
    <section class="chat" aria-labelledby="room-title">
      <header class="chat-head">
        <button class="icon-button mobile-back" id="back" aria-label="返回聊天列表"></button>
        <div class="avatar core" id="head-avatar" aria-hidden="true">N</div>
        <div class="identity">
          <h2 id="room-title">Noema</h2>
          <p id="room-subtitle">你和 Noema 的私聊</p>
        </div>
        <div class="head-actions">
          <button
            class="icon-button search-action"
            id="search-room"
            aria-label="查找本聊天内容示意"
          ></button
          ><button
            class="icon-button"
            id="details"
            aria-label="查看聊天信息"
            aria-expanded="false"
          ></button>
        </div>
      </header>
      <div class="thread" id="thread" role="log" aria-label="合成聊天内容"></div>
      <form class="composer-wrap" id="composer-form">
        <div class="composer">
          <label for="draft" hidden>消息</label
          ><textarea id="draft" placeholder="和 Noema 说点什么…" rows="2"></textarea>
          <div class="composer-tools">
            <button type="button" class="icon-button" id="attach" aria-label="附件示意"></button
            ><span class="hint">Enter 发送 · Shift Enter 换行</span
            ><button class="send" id="send" type="submit" disabled>
              发送 <span id="send-icon"></span>
            </button>
          </div>
        </div>
        <div class="composer-note">
          <span class="context" id="context-note"></span><span>仅在此聊天中继续</span>
        </div>
      </form>
    </section>
    <aside class="detail" id="detail" hidden>
      <h3 id="detail-name">Noema</h3>
      <p>同一位联系人，可以参与不同聊天。房间记录默认彼此独立。</p>
      <p>此预览不展示自动记忆、主动联系或任务执行；它们不是已经交付的能力。</p>
      <button id="close-detail">关闭信息</button>
    </aside>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <p class="review-note" id="review-note">
    <strong>A · 日常通信：</strong
    >以会话列表和清楚的房间边界建立熟悉感；克制的墨蓝、紧凑身份标记与稳定阅读节奏。适合频繁切换联系人。模型与工程设置退入次级入口。
  </p>
  <script>
    const $ = (id) => document.getElementById(id);
    const paths = {
      chat: '<path d="M20 11a8 8 0 0 1-8 8H5l-4 3V11a9 9 0 0 1 19 0Z"/>',
      people:
        '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m2-15a3 3 0 0 1 0 6m2 4a5 5 0 0 1 2 5"/>',
      settings:
        '<circle cx="12" cy="12" r="3"/><path d="m10 3 4 0 1 3 3 1 3 3-1 4-3 1-1 3-3 3-4-1-1-3-3-1-3-3 1-4 3-1 1-3Z"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      search: '<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
      back: '<path d="m14 5-7 7 7 7"/>',
      more: '<circle cx="5" cy="12" r=".7"/><circle cx="12" cy="12" r=".7"/><circle cx="19" cy="12" r=".7"/>',
      attach: '<path d="m8 12 7-7a4 4 0 0 1 6 6L10 22a6 6 0 0 1-8-8L13 3m-8 14 10-10"/>',
      send: '<path d="m3 3 18 9-18 9 3-9-3-9Zm3 9h15"/>',
      lock: '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/>',
    };
    function icon(name) {
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' + paths[name] + "</svg>";
    }
    for (const [id, name] of Object.entries({
      "nav-chats": "chat",
      "nav-contacts": "people",
      "nav-settings": "settings",
      "new-chat": "plus",
      "find-icon": "search",
      "local-icon": "lock",
      back: "back",
      "search-room": "search",
      details: "more",
      attach: "attach",
      "send-icon": "send",
    }))
      $(id).innerHTML = icon(name);
    const rooms = [
      {
        id: "noema",
        name: "Noema",
        mark: "N",
        type: "core",
        subtitle: "你和 Noema 的私聊",
        preview: "你希望我陪你聊聊画什么？",
        time: "21:18",
      },
      {
        id: "lin",
        name: "林间",
        mark: "林",
        type: "",
        subtitle: "你和林间的私聊",
        preview: "可以从路边的一片叶子开始。",
        time: "昨天",
      },
      {
        id: "group",
        name: "周末，慢一点",
        mark: "三",
        type: "group",
        subtitle: "你、Noema、林间 · 群聊",
        preview: "林间：不妨先选一个近的地方。",
        time: "周日",
      },
    ];
    const content = {
      noema: [
        ["user", "最近下班总想着做很多事，最后却一件也没做。", "21:12"],
        ["agent", "先别急着把晚上排满。你最想留下的，是一段安静时间，还是做成一件小事？", "21:13"],
        ["user", "一段自己的时间。想重新开始画画，但不想又变成计划。", "21:16"],
        [
          "agent",
          "那就先给它留一个很小的位置。今晚只拿出纸和笔，画不画都可以。\n\n你希望我陪你聊聊画什么，还是先停在这里？",
          "21:18",
        ],
      ],
      lin: [
        ["user", "想找点简单的东西画。", "昨天"],
        ["agent", "可以从路边的一片叶子开始。试着只看它的边缘，不急着画完整。", "昨天"],
      ],
      group: [
        ["user", "这个周末想出去走走，你们有什么想法？", "周日"],
        ["agent", "不妨先选一个近的地方。人少一点，能慢慢走就很好。", "周日", "林间"],
      ],
    };
    let active = "noema",
      direction = "daily",
      failed = false,
      toastTimer;
    const drafts = {};
    function notice(text) {
      $("toast").textContent = text;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => ($("toast").textContent = ""), 3500);
    }
    function renderRooms() {
      $("room-list").replaceChildren();
      for (const r of rooms) {
        const b = document.createElement("button");
        b.className = "room" + (r.id === active ? " active" : "");
        b.setAttribute("aria-current", String(r.id === active));
        b.innerHTML =
          '<span class="avatar ' +
          r.type +
          '">' +
          r.mark +
          '</span><span class="room-content"><span class="room-line"><span class="room-name">' +
          r.name +
          '</span><span class="time">' +
          r.time +
          '</span></span><span class="preview">' +
          r.preview +
          "</span></span>";
        b.onclick = () => selectRoom(r.id);
        $("room-list").append(b);
      }
    }
    function renderThread() {
      const thread = $("thread");
      thread.replaceChildren();
      const day = document.createElement("p");
      day.className = "day";
      day.textContent = active === "noema" ? "今天 · 10 月 21 日" : "合成会话示例";
      thread.append(day);
      for (const [index, m] of content[active].entries()) {
        const row = document.createElement("div");
        row.className = "message " + (m[0] === "user" ? "user" : "");
        const avatar = document.createElement("span");
        avatar.className = "avatar core";
        avatar.textContent = active === "lin" ? "林" : "N";
        avatar.setAttribute("aria-hidden", "true");
        const body = document.createElement("div");
        body.className = "message-body";
        if (m[0] !== "user") {
          const name = document.createElement("div");
          name.className = "message-name";
          name.textContent = m[3] || rooms.find((r) => r.id === active).name;
          body.append(name);
        }
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent =
          failed && active === "noema" && index === 3 ? "那就先给它留一个很小的位置。" : m[1];
        body.append(bubble);
        const time = document.createElement("div");
        time.className = "message-time";
        time.textContent = m[2];
        body.append(time);
        if (failed && active === "noema" && index === 3) {
          const error = document.createElement("div");
          error.className = "failure";
          error.append(document.createTextNode("这次回复没有完成。你的消息和已有内容已保留。"));
          error.append(document.createElement("br"));
          const retry = document.createElement("button");
          retry.textContent = "重试这次回复（示意）";
          retry.onclick = () => {
            failed = false;
            $("failure").setAttribute("aria-pressed", "false");
            renderThread();
            notice("已回到完整示意回复，未调用模型。");
          };
          error.append(retry);
          body.append(error);
        }
        row.append(avatar, body);
        thread.append(row);
      }
    }
    function selectRoom(id) {
      drafts[active] = $("draft").value;
      active = id;
      const r = rooms.find((r) => r.id === id);
      $("room-title").textContent = r.name;
      $("room-subtitle").textContent = r.subtitle;
      $("head-avatar").textContent = r.mark;
      $("head-avatar").className = "avatar " + r.type;
      $("draft").placeholder = "和" + r.name + "说点什么…";
      $("draft").value = drafts[id] || "";
      $("send").disabled = !$("draft").value.trim();
      $("frame").classList.remove("rooms-open");
      $("detail-name").textContent = r.name;
      closeDetail();
      renderRooms();
      renderThread();
      requestAnimationFrame(() => ($("thread").scrollTop = $("thread").scrollHeight));
    }
    function setDirection(id) {
      direction = id;
      requestAnimationFrame(() => ($("thread").scrollTop = $("thread").scrollHeight));
      $("frame").classList.toggle("quiet", id === "quiet");
      $("daily").setAttribute("aria-pressed", String(id === "daily"));
      $("quiet").setAttribute("aria-pressed", String(id === "quiet"));
      $("review-note").innerHTML =
        id === "daily"
          ? "<strong>A · 日常通信（推荐）：</strong>会话列表常驻，房间边界直观；墨蓝身份标记与紧凑阅读节奏。适合频繁切换联系人。模型与工程设置退入次级入口。"
          : "<strong>B · 沉浸对话：</strong>默认收起会话列表，采用温暖纸色和更舒展的阅读列，强调与一个持续身份的交流。代价是跨房间定位多一次操作；可能更像长文对话应用。点击左侧聊天图标可展开列表。";
    }
    function closeDetail() {
      $("detail").hidden = true;
      $("details").setAttribute("aria-expanded", "false");
    }
    $("daily").onclick = () => setDirection("daily");
    $("quiet").onclick = () => setDirection("quiet");
    $("size").onclick = () => {
      const narrow = $("frame").classList.toggle("narrow");
      $("size").setAttribute("aria-pressed", String(narrow));
      requestAnimationFrame(() => ($("thread").scrollTop = $("thread").scrollHeight));
    };
    $("failure").onclick = () => {
      if (active !== "noema") selectRoom("noema");
      failed = !failed;
      $("failure").setAttribute("aria-pressed", String(failed));
      renderThread();
      $("thread").scrollTop = $("thread").scrollHeight;
    };
    $("draft").oninput = () => {
      drafts[active] = $("draft").value;
      $("send").disabled = !$("draft").value.trim();
    };
    $("draft").onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        $("composer-form").requestSubmit();
      }
    };
    $("composer-form").onsubmit = (e) => {
      e.preventDefault();
      const text = $("draft").value.trim();
      if (!text) return;
      content[active].push(["user", text, "预览"]);
      $("draft").value = "";
      drafts[active] = "";
      $("send").disabled = true;
      renderThread();
      $("thread").scrollTop = $("thread").scrollHeight;
      notice("已加入预览，未发送给模型。");
    };
    $("nav-chats").onclick = () => {
      $("frame").classList.toggle("rooms-open");
    };
    $("back").onclick = () => {
      $("frame").classList.add("rooms-open");
      $("room-list").querySelector("button").focus();
    };
    $("details").onclick = () => {
      const open = $("detail").hidden;
      $("detail").hidden = !open;
      $("details").setAttribute("aria-expanded", String(open));
      if (open) $("close-detail").focus();
    };
    $("close-detail").onclick = () => {
      closeDetail();
      $("details").focus();
    };
    for (const id of [
      "nav-contacts",
      "nav-settings",
      "new-chat",
      "find-chat",
      "search-room",
      "attach",
    ])
      $(id).onclick = () => notice("此入口仅表示位置；本次预览不实现该功能。");
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeDetail();
        $("frame").classList.remove("rooms-open");
        $("draft").focus();
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        $("frame").classList.add("rooms-open");
        $("room-list").querySelector("button").focus();
      }
    });
    const params = new URLSearchParams(location.search);
    setDirection(params.get("direction") === "quiet" ? "quiet" : "daily");
    if (params.get("size") === "narrow" || innerWidth < 700) {
      $("frame").classList.add("narrow");
      $("size").setAttribute("aria-pressed", "true");
    }
    if (params.get("state") === "failure") {
      failed = true;
      $("failure").setAttribute("aria-pressed", "true");
    }
    selectRoom("noema");
    $("context-note").innerHTML = icon("chat") + " 当前聊天";
  </script>
</html>
